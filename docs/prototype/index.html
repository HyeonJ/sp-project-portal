<style>

/* ========== Topbar ========== */

.card-list .item:hover{background:color-mix(in oklab,var(--surface),var(--accent) 2%);transform:translateX(2px);box-shadow:inset 2px 0 0 color-mix(in oklab,var(--accent),transparent 50%)}

.card-list .item .body b{color:var(--fg);font-weight:600}

/* ========== Grid ========== */
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ========== Buttons ========== */

.action-bar{background:var(--surface);border:1px solid var(--layer-border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:var(--panel-shadow),var(--soft-inset)}

/* ========== Deliverable box ========== */

/* ========== Modal ========== */
.modal-backdrop{position:fixed;inset:0;background:color-mix(in oklab,var(--fg),transparent 74%);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(8px)}

.modal-body input[type=text],.modal-body input[type=email],.modal-body input[type=password],.modal-body input[type=date],.modal-body textarea,.modal-body select{width:100%;border:1px solid var(--divider);background:var(--surface);border-radius:9px;padding:9px 11px;color:var(--fg);outline:none;box-shadow:var(--soft-inset)}
.modal-body input:focus,.modal-body textarea:focus,.modal-body select:focus{border-color:color-mix(in oklab,var(--accent),var(--surface) 55%);background:var(--surface);box-shadow:var(--focus-ring)}

.modal-body .note{padding:11px 13px;background:var(--accent-soft);border-radius:10px;font-size:12px;line-height:1.7;color:var(--accent-deep);border:1px solid color-mix(in oklab,var(--accent),var(--surface) 82%);box-shadow:var(--soft-inset)}

.dropzone{margin-top:12px;border:1.5px dashed var(--divider);border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color var(--motion-fast) var(--ease-standard),background var(--motion-fast) var(--ease-standard)}

.doc-page .doc-line.w92{width:92%}.doc-page .doc-line.w88{width:88%}.doc-page .doc-line.w85{width:85%}.doc-page .doc-line.w78{width:78%}.doc-page .doc-line.w76{width:76%}.doc-page .doc-line.w70{width:70%}.doc-page .doc-line.w60{width:60%}.doc-page .doc-line.w50{width:50%}.doc-page .doc-line.w95{width:95%}.doc-page .doc-line.w90{width:90%}

/* ========== Dropdown ========== */
.dropdown{position:absolute;background:var(--surface);border:1px solid var(--layer-border);border-radius:12px;box-shadow:var(--panel-shadow-hover);padding:6px;z-index:60;min-width:220px;animation:popin .12s ease}

/* ========== Role switcher ========== */
.role-switcher{position:fixed;bottom:24px;left:24px;background:color-mix(in oklab,var(--surface),transparent 4%);backdrop-filter:blur(12px);border:1px solid var(--layer-border);border-radius:99px;padding:6px 8px;box-shadow:var(--panel-shadow-hover);display:flex;gap:4px;z-index:40;align-items:center}

/* ========== Table ========== */

.form{display:flex;flex-direction:column;gap:16px}

.form textarea{min-height:64px;resize:vertical;font:inherit}

/* ========== Activity timeline ========== */
.activity{display:flex;flex-direction:column}

/* ========== File card ========== */

.ai-progress{display:flex;flex-direction:column;gap:1px}

.ai-progress .step.now{color:var(--accent);font-weight:600}
.ai-progress .step.fail{color:var(--hot)}
.ai-progress .step.pending{color:var(--muted-2)}
.ai-progress .step .ico .sdot{width:9px;height:9px;border-radius:50%;background:var(--muted-2);display:inline-block}

.kpi .sub{font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--mono)}

.milestone-strip{display:flex;gap:22px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px;scrollbar-width:thin}
.milestone-strip .ms{flex:0 0 auto;min-width:160px;background:var(--surface);border:1px solid var(--layer-border);border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:4px;position:relative;box-shadow:var(--soft-inset)}

.milestone-strip .ms .ttl{font:600 13px/1.2 var(--font);color:var(--fg)}
.milestone-strip .ms .meta{font-size:11px;color:var(--muted)}

.milestone-strip .ms.current{border-color:color-mix(in oklab,var(--accent),var(--surface) 70%);box-shadow:0 0 0 1px color-mix(in oklab,var(--accent),transparent 76%) inset,var(--panel-shadow);background:var(--accent-soft)}

.milestone-strip .ms+.ms::before{content:'›';position:absolute;left:-14px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:14px}

.roadmap-section-title{font:600 12px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}

.phase-head .num{font:650 11px/1 var(--mono);color:var(--muted);min-width:0;height:auto;padding:0;background:transparent;border:0;border-radius:0;display:inline-flex;align-items:center;justify-content:flex-start}

.stage-row.current:hover{background:linear-gradient(90deg,color-mix(in oklab,var(--accent),transparent 92%),color-mix(in oklab,var(--surface),var(--accent) 2.4%) 42%,var(--surface))}
.stage-marker{--marker:var(--muted-2);position:relative;z-index:1;width:34px;height:18px;display:block}

.stage-row.done .stage-marker,.stage-row.pass .stage-marker{--marker:var(--ok)}

.stage-row.pending .stage-marker{--marker:var(--warn)}
.stage-row.skip .stage-marker{--marker:var(--border-strong)}

.stage-row .num{font:650 12px/1 var(--mono);color:var(--muted);text-align:left}
.stage-row.current .num{color:var(--accent)}
.stage-row.pass .num,.stage-row.done .num{color:var(--fg-2)}
.stage-row .name{font:550 13px/1.4 var(--font);color:var(--fg-2)}
.stage-row.current .name{font-weight:700;color:var(--fg)}
.stage-row.lock .name{color:var(--muted)}
.stage-row.skip .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}

.stage-row .badge{display:inline-flex;align-items:center;gap:4px;font:550 11px/1 var(--mono);padding:5px 9px;border-radius:99px;border:1px solid var(--divider);background:var(--surface);color:var(--muted);white-space:nowrap;box-shadow:var(--soft-inset)}

  .stage-marker{width:28px}
  .stage-row .badge,.stage-row .gate-flag,.stage-row .deliv{grid-column:3;justify-self:start}
}

  ['/projects/:id/settings/members', 'project', renderMembers, 'settings'],
  ['/projects/:id/settings/danger', 'project', renderDanger, 'settings'],
  ['/projects/:id/settings', 'project', renderSettings, 'settings'],
  ['/projects/:id', 'project', renderDashboard, 'dashboard'],
];

function match(path){
  for(const [pat, layout, render, active] of routes){
    const keys = [];
    const re = '^' + pat.replace(/:([^/]+)/g, (_,k)=>{ keys.push(k); return '([^/]+)'; }) + '$';
    const m = path.match(new RegExp(re));
    if(m){
      const params = {};
      keys.forEach((k,i)=>params[k] = m[i+1]);
      return { layout, render, params, active };
    }
  }
  return null;
}

function navigateRender(){
  closeDropdowns();
  closeModals();
  const path = location.hash.slice(1) || '/projects/A';
  state.currentRoute = '#' + path;
  const route = match(path);
  if(!route){ renderLayoutWith('system', renderError({code:'404'})); return; }
  const content = route.render(route.params);
  renderLayoutWith(route.layout, content, route.params, route.active);
  window.scrollTo(0,0);
}

/* 현재 라우트를 스크롤 위치 유지한 채 다시 그림 (in-place state 갱신용) */
function rerender(){
  const path = location.hash.slice(1) || '/projects/A';
  const route = match(path);
  if(!route) return;
  const y = window.scrollY;
  closeDropdowns();
  renderLayoutWith(route.layout, route.render(route.params), route.params, route.active);
  window.scrollTo(0, y);
}

window.addEventListener('hashchange', navigateRender);

    app.innerHTML = `

        ${renderGlobalSidebar()}
        <div>
          ${renderTopbar('global', params)}
          <main class="main">${content}</main>
        </div>
      </div>`;

function renderRoadmap(params){
  const proj = DATA.projects.find(p=>p.id===params.id) || DATA.projects[0];

  // KPI 계산
  let totalStages = 0, doneStages = 0, gates = 0, passedGates = 0;
  ROADMAP.phases.forEach(ph => ph.stages.forEach(s => {
    totalStages++;
    if(s.status === 'done' || s.status === 'pass' || s.status === 'skip') doneStages++;
    if(s.gate){ gates++; if(s.status === 'pass') passedGates++; }
  }));
  const nextMajor = ROADMAP.milestones.find(m => m.major && m.status !== 'done');

  const milestoneHtml = ROADMAP.milestones.map(m => `
    <div class="ms ${m.status}">
      <span class="code">${m.code} · Gate ${m.gate}</span>
      <span class="ttl">${esc(m.label)}</span>
      <span class="meta">${esc(m.when)}</span>
    </div>
  `).join('');

  const phasesHtml = ROADMAP.phases.map((ph, i) => {
    const stagesHtml = ph.stages.map(s => {
      const deliv = s.deliverable ? `<button class="deliv" data-route="${s.deliverable.route}">${esc(s.deliverable.label)}</button>` : '';
      const gateFlag = s.gate ? `<span class="gate-flag">${s.major?'Major ':''}Gate ${s.n}</span>` : '';
      const detail = s.detail ? `<span class="detail">${esc(s.detail)}</span>` : '';
      return `
        <div class="stage-row ${s.status} ${s.gate?'gate':''} ${s.major?'major':''}">
          <span class="stage-marker" aria-hidden="true"></span>
          <span class="num">${esc(s.n)}</span>
          <div class="name">${esc(s.name)}${detail}</div>
          ${gateFlag}
          ${deliv || `<span class="badge">${esc(s.badge||'')}</span>`}
        </div>
      `;
    }).join('');
    return `
      <div class="phase ${ph.muted?'muted':''}">
        <div class="phase-head">
          <span class="num">${i+1}</span>
          <span class="name">${esc(ph.label)}</span>
          <span class="count">${ph.stages.length}단계</span>
          ${ph.note?`<span class="phase-note">${esc(ph.note)}</span>`:''}
        </div>
        <div class="stage-list">${stagesHtml}</div>
      </div>
    `;
  }).join('');

  return html`
    <div class="page-bar">
      <div>
        <h1 class="page-title">진행 현황</h1>
      </div>
    </div>

    <section class="kpi-row">
      <div class="kpi accent">
        <div class="label">전체 진행률</div>
        <div class="value">${proj.stage}<span class="unit">/ ${proj.total}</span></div>
        <div class="sub">${proj.progress}% · W${proj.week}</div>
      </div>
      <div class="kpi">
        <div class="label">통과한 게이트</div>
        <div class="value">${passedGates}<span class="unit">/ ${gates}</span></div>
        <div class="sub">Major 게이트: 1/2 통과</div>
      </div>
      <div class="kpi">
        <div class="label">현재 단계</div>
        <div class="value">${proj.stage}<span class="unit"> · 시안 등록</span></div>
        <div class="sub">Gate 13 컨펌 대기</div>
      </div>
      <div class="kpi">
        <div class="label">다음 메이저 마일스톤</div>
        <div class="value" style="font-size:18px">${esc(nextMajor?nextMajor.code:'—')}<span class="unit"> ${esc(nextMajor?nextMajor.label:'')}</span></div>
        <div class="sub">${esc(nextMajor?nextMajor.when:'—')}</div>
      </div>
    </section>

    <h3 class="roadmap-section-title">마일스톤 (M1 ~ M7)</h3>
    <div class="milestone-strip">${milestoneHtml}</div>

    <h3 class="roadmap-section-title">단계별 상세</h3>
    ${phasesHtml}

    <div class="state-info" style="margin-top:18px">
      <b>범례</b> · 얇은 tick 색상으로 완료/진행/검토/대기 상태를 구분합니다. 긴 진행 바 대신 행의 상태 pill과 산출물 액션이 다음 확인 지점을 보여줍니다.<br>
      <b>게이트</b> · Gate pill은 컨펌 전 다음 단계 진행 불가 지점을 의미합니다. <b>Major</b>(9·22)는 프로젝트 진행 전체 차단.
    </div>
  `;
}

      ${state.role==='pm' ? `<button class="btn primary" style="margin-top:14px" data-action="open-new-version" data-slot="${slug}">+ 새 버전 만들기${ahead?' (선행)':''}</button>` : ''}
    </div>`;
}

/* 슬롯 페이지 공통 (요구사항 + 산출물) */
function renderSlotPage({slot, slug, title, subtitle, isDeliverable=false}){
  const role = state.role;
  const ahead = gateAhead(slug); // 진입 게이트 미통과면 '선행 작업'
  const isDraft = slot.status === 'draft';
  const isLocked = !isDraft;
  const statusBadge = {
    draft: '<span class="pill warn">draft (작성 중)</span>',
    'pending-review': '<span class="pill warn">검토중 (잠김)</span>',
    confirmed: '<span class="pill ok">✓ 컨펌 완료</span>',
    rejected: '<span class="pill hot">반려</span>',
  }[slot.status];

  // version snapshot — 선택 버전(과거면 읽기 전용, 파일만 스냅샷 / 활동 이력은 전체 통합 유지)
  const versions = VERSIONS[slug] || [];
  const latestV = slot.version;
  const viewV = state.viewVersion[slug] || latestV;
  const viewingOld = viewV !== latestV;
  const verEntry = versions.find(x => x.v === viewV);
  const displayFiles = viewingOld ? (verEntry?.files || []) : slot.files;
  const canEditFiles = !viewingOld && isDraft && role==='pm';

  // file list
  const filesHtml = displayFiles.length ? displayFiles.map((f,i) => {
    const rp = state.replacePending;
    if(rp && rp.slug===slug && rp.idx===i){
      return html`
        <div class="file replacing">
          <span class="icn">🔄</span>
          <div class="name">
            <b>${esc(f.name)}</b>
            <span class="sub">→ <span class="to">${esc(rp.newName)}</span> (${esc(rp.newSize)}) 로 교체할까요?</span>
          </div>
          <div class="actions">
            <button class="btn sm accent" data-action="confirm-replace">교체 확정</button>
            <button class="btn sm" data-action="cancel-replace">취소</button>
          </div>
        </div>`;
    }
    if(f.kind==='url'){
      return html`
      <div class="file">
        <span class="icn">🔗</span>
        <div class="name">
          <b>${esc(f.name)}</b>
          <span class="sub">${esc(f.desc)} · <span style="color:var(--muted-2)">${esc(f.url||'')}</span></span>
        </div>
        <span class="badge" style="background:var(--surface-2);color:var(--muted)">링크</span>
        <div class="actions">
          <button class="btn sm accent" data-action="open-url" data-url="${esc(f.url||'')}">열기</button>
          ${canEditFiles ? `<button class="btn sm danger" data-action="delete-file" data-idx="${i}" data-slug="${slug}">삭제</button>` : ''}
        </div>
      </div>`;
    }
    return html`
    <div class="file">
      <span class="icn">📄</span>
      <div class="name">
        <b>${esc(f.name)}</b>
        <span class="sub">${esc(f.size)} · ${esc(f.desc)}</span>
      </div>
      ${f.badge ? `<span class="badge" style="background:${f.badge==='NEW'?'var(--accent-soft)':'var(--surface-2)'};color:${f.badge==='NEW'?'var(--accent-deep)':'var(--muted)'}">${esc(f.badge)}</span>` : ''}
      <div class="actions">
        <button class="btn sm accent" data-action="view-file" data-file="${esc(f.name)}" data-slug="${slug}">보기</button>
        <button class="btn sm" data-action="download" data-file="${esc(f.name)}">다운로드</button>
        ${canEditFiles ? `
          <button class="btn sm" data-action="replace-file" data-idx="${i}" data-slug="${slug}">교체</button>
          <button class="btn sm danger" data-action="delete-file" data-idx="${i}" data-slug="${slug}">삭제</button>` : ''}
      </div>
    </div>`;
  }).join('') : '<div class="empty"><span class="ico">📁</span><p>파일 없음 — [+ 파일 업로드]로 시작</p></div>';

  // snapshot comments
  const commentGroups = slot.comments || (slot.comments = []);
  let activeCommentGroup = commentGroups.find((group) => group.version === viewV);
  if(!activeCommentGroup){
    activeCommentGroup = {version:viewV, items:[]};
    if(slot.status !== 'empty') commentGroups.push(activeCommentGroup);
  }
  const comments = activeCommentGroup.items || [];
  const commentsHtml = comments.length ? comments.map((c, ci) => {
    const a = commentAuthor(c.who);
    const ec = state.editingComment;
    const editing = ec && ec.slug===slug && ec.version===viewV && ec.idx===ci;
    const editIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
    const delIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
    const dataAttr = `data-slug="${slug}" data-version="${esc(viewV)}" data-idx="${ci}"`;
    return html`
    <div class="comment-item">
      <span class="comment-avatar ${a.role}">${esc(a.initial)}</span>
      <div>
        <div class="comment-meta">
          <span><span class="who">${esc(a.name)}</span><span class="role-badge ${a.role}">${a.roleLabel}</span> <span class="time">· ${esc(c.time)}${c.edited?' · 수정됨':''}</span></span>
          ${c.own && !editing ? `<div class="actions" style="margin-top:0;flex-shrink:0"><button class="icon-action accent" data-action="edit-comment" ${dataAttr} title="수정" aria-label="수정">${editIcon}</button><button class="icon-action danger" data-action="delete-comment" ${dataAttr} title="삭제" aria-label="삭제">${delIcon}</button></div>` : ''}
        </div>
        ${editing
          ? `<div class="comment-edit">
              <textarea id="editCommentTa" class="comment-edit-ta">${esc(c.body)}</textarea>
              <div class="comment-edit-actions">
                <button class="btn sm" data-action="cancel-comment-edit">취소</button>
                <button class="btn sm primary" data-action="save-comment-edit">저장</button>
              </div>
            </div>`
          : `<div class="comment-body">${esc(c.body)}</div>`}
      </div>
    </div>`;
  }).join('') : '<div class="empty"><span class="ico">💬</span><p>이 스냅샷에는 아직 코멘트가 없습니다.</p></div>';

  // activities
  const activityEvents = slot.activities.filter((a) => a.type !== 'comment');
  const activityTypeLabels = {upload:'새 버전 생성', review:'검토 요청', reject:'반려', approve:'컨펌', invalidate:'컨펌 무효화', upstream:'선행 검토'};
  const actHtml = activityEvents.map((a) => {
    return html`
    <div class="activity-item activity"><div class="item">
      <span class="marker ${a.type}"><span class="dot"></span></span>
      <div class="body">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div class="meta" style="margin-bottom:0"><b>${esc(a.who)}</b> · ${esc(a.time)} · ${activityTypeLabels[a.type]}${a.tag?` <span style="color:var(--hot)">(${esc(a.tag)})</span>`:''}</div>
        </div>
        <div class="desc" style="margin-top:4px">${a.body}</div>
      </div>
    </div></div>`;
  }).join('') || '<div class="empty"><span class="ico">🕘</span><p>아직 기록된 운영 이벤트가 없습니다.</p></div>';

  // version dropdown
  const versionLabel = viewingOld
    ? `${viewV} · 과거 스냅샷 (읽기 전용)`
    : `${slot.version}${isDraft ? ' · draft (최신, 미발송)' : isLocked && slot.status==='confirmed' ? ' (최신, 컨펌)' : ' (최신)'}`;

  // actions
  let actions = '';
  if(role === 'pm'){
    actions = html`
      <button class="btn" data-action="open-new-version" data-slot="${slug}">+ 새 버전 만들기</button>
      ${isDraft ? `<button class="btn primary" data-action="open-review" data-slot="${slug}">검토 요청 발송</button>` :
        `<button class="btn locked" title="draft에서만 활성">검토 요청 발송</button>`}
      <button class="btn locked">[고객사] 컨펌</button>
      <button class="btn locked">[고객사] 반려</button>`;
  } else if(role === 'client'){
    if(slot.status === 'pending-review'){
      actions = html`
        <button class="btn locked">+ 새 버전 만들기</button>
        <button class="btn locked">검토 요청 발송</button>
        <button class="btn primary" data-action="open-approve" data-mode="approve" data-slot="${slug}">컨펌</button>
        <button class="btn danger" data-action="open-approve" data-mode="reject" data-slot="${slug}">반려</button>`;
    } else {
      actions = `<button class="btn locked">컨펌 (검토 요청 수신 시 활성)</button>`;
    }
  } else {
    actions = `<span style="color:var(--muted);font-size:12px">관리자: 조회만 가능. 편집·컨펌 권한 없음.</span>`;
  }

  return html`
    <div class="page-bar">
      <div>
        <h1 class="page-title">${esc(title)}</h1>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${statusBadge}
        <button class="btn sm" data-action="version-dropdown" data-slot="${slug}">${esc(versionLabel)} <span class="btn-caret">▾</span></button>
      </div>
    </div>

    ${ahead ? `<div class="state-info" style="margin-bottom:14px;border-color:color-mix(in oklab,var(--warn),transparent 70%);color:var(--warn)">⚠ <b>선행 작업</b> · ${esc(ahead.label)} 미통과 — 이 산출물은 잠정(선행) 단계입니다. 업로드·편집은 가능하나 정식 진행은 이전 게이트 통과 후, 컨펌은 순서대로만 가능합니다.</div>` : ''}

    ${slot.upstreamChanged && slot.status==='confirmed' ? `<div class="state-info" style="margin-bottom:14px;border-color:color-mix(in oklab,var(--warn),transparent 55%);color:var(--warn);display:flex;align-items:center;gap:12px;justify-content:space-between">
      <span>⚠ <b>선행 산출물 변경 · 검토 권장</b> — 선행 산출물(<b>${esc(SLOT_TITLE[UPSTREAM[slug]]||'')}</b>)이 새 버전으로 바뀌었습니다. 영향이 없으면 검토 완료, 수정이 필요하면 새 버전을 만드세요. (REQ-WF-005)</span>
      ${role==='pm' ? `<button class="btn sm" data-action="ack-upstream" data-slot="${slug}" style="flex-shrink:0">검토 완료(영향 없음)</button>` : ''}
    </div>` : ''}

    <section class="card" style="margin-bottom:14px">
      <div class="card-head">
        <h3>파일 (${esc(viewV)} 스냅샷 — ${displayFiles.length}개)</h3>
        <span class="meta">${viewingOld ? '과거 버전 · 읽기 전용' : isDraft ? '편집 가능 · 검토 요청 시 잠금' : '읽기 전용 · 다운로드만'}</span>
      </div>
      ${viewingOld ? `<div class="state-info" style="margin-bottom:12px">📌 <b>${esc(viewV)} 스냅샷</b>을 조회 중입니다 (읽기 전용). <a data-action="select-version" data-slug="${slug}" data-v="${esc(latestV)}" style="color:var(--accent);cursor:pointer;text-decoration:underline">최신 ${esc(latestV)}으로 돌아가기</a></div>` : ''}
      <div style="display:flex;flex-direction:column;gap:8px">${filesHtml}</div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
        <button class="btn ${canEditFiles ? 'primary':'locked'}" ${canEditFiles ? 'data-action="upload-file" data-slot="'+slug+'"':''}>+ 파일 업로드</button>
        ${canEditFiles ? `<button class="btn" data-action="add-link" data-slot="${slug}">+ 외부 링크 추가</button>` : ''}
        <span style="font-size:11px;color:var(--muted)">${viewingOld ? '과거 스냅샷에서는 편집 불가. 최신 버전으로 돌아가세요.' : ''}</span>
      </div>
      ${slot.status==='confirmed' && role==='pm' ? `<div class="state-info" style="margin-top:12px;border-color:color-mix(in oklch,var(--warn) 30%,var(--surface));color:var(--warn)">주의: 컨펌 완료 상태에서 새 버전 생성 시 <b>이전 컨펌 자동 무효화 → 상태 '검토중' 복귀</b></div>`:''}
    </section>

    <section class="card" style="margin-bottom:14px">
      <div class="card-head">
        <h3>코멘트 (${comments.length})</h3>
        <span class="meta">${esc(viewV)} 스냅샷 기준</span>
      </div>
      <div class="snapshot-comments">
        <div class="comment-thread">${commentsHtml}</div>
        ${slot.status !== 'empty' ? html`
          <div class="comment-composer">
            <textarea id="newComment" placeholder="${esc(viewV)} 스냅샷에 코멘트 작성"></textarea>
            <div style="text-align:right;margin-top:6px"><button class="btn primary sm" data-action="post-comment" data-slug="${slug}" data-version="${esc(viewV)}">등록</button></div>
          </div>` : ''}
      </div>
    </section>

    <section class="card" style="margin-bottom:14px">
      <div class="card-head">
        <h3>활동 이력 (${activityEvents.length})</h3>
        <span class="meta">상태 변경 · 검토 요청 · 승인/반려만 기록</span>
      </div>
      <div class="activity">${actHtml}</div>
    </section>

    <section class="action-bar" style="margin-bottom:0">
      <span class="label">액션</span>
      ${actions}
    </section>`;
}

/* ============================================================
 * EVENT DELEGATION
 * ============================================================ */
document.addEventListener('click', e => {
  // route
  const r = e.target.closest('[data-route]');
  if(r){ e.preventDefault(); navigate(r.dataset.route); closeDropdowns(); return; }

  // action
  const t = e.target.closest('[data-action]');
  if(!t){ closeDropdowns(); return; }
  const a = t.dataset.action;

  if(a==='close-modal'){ closeModals(); return; }

  // Review
  if(a==='open-review'){ openModal(modalReview(t.dataset.slot)); return; }
  if(a==='submit-review'){ closeModals(); toast('검토 요청 발송 완료 — 고객사에 이메일 전송','success'); return; }

  // Approve/Reject
  if(a==='open-approve'){ openModal(modalApprove(t.dataset.mode||'approve')); return; }
  if(a==='submit-approve'){
    const result = document.querySelector('input[name="result"]:checked').value;
    if(result==='reject' && !document.getElementById('rejectReason').value.trim()){
      document.getElementById('rejectErr').style.display='block';
      return;
    }
    closeModals();
    toast(result==='approve' ? '✓ Gate 13 컨펌 통과 — 다음 단계 진행' : '반려 처리됨 — 팀에 알림 발송', result==='approve' ? 'success' : 'danger');
    return;
  }

  // AI Build
  if(a==='open-dev'){ openModal(modalDev()); return; }
  if(a==='export-locked'){ toast('Gate 22 통과 후 가능합니다','danger'); return; }

  // New version
  if(a==='open-new-version'){ openModal(modalNewVersion(t.dataset.slot||'requirements'),true); return; }
  if(a==='submit-new-version'){
    const note = document.getElementById('changeNote');
    if(!note || !note.value.trim()){ const e=document.getElementById('noteErr'); if(e) e.style.display='block'; return; }
    const slug = t.dataset.slot;
    const next = t.dataset.next;
    const slot = DATA.slot[slug];
    const summary = note.value.trim();
    const who = {pm:'PM', client:'고객사', admin:'관리자'}[state.role] || 'PM';
    const wasConfirmed = slot.status === 'confirmed';
    const prevVer = slot.version;
    const versions = VERSIONS[slug] || (VERSIONS[slug] = []);
    const curEntry = versions.find(v => v.v === prevVer);
    if(curEntry && !curEntry.files){ curEntry.files = (slot.files||[]).map(f=>({...f})); } // 현재 최신 파일을 과거 스냅샷으로 동결
    versions.push({v: next, status:'draft'});
    slot.files = (slot.files||[]).map(f=>({...f, badge:''})); // 베이스 사본(배지 초기화)
    slot.version = next;
    slot.status = 'draft';
    slot.updated = '방금 전';
    slot.upstreamChanged = false; // 새 버전 = 새 baseline
    slot.activities = slot.activities || [];
    slot.activities.push({type:'upload', who, time:'방금 전', body:`<b>${esc(next)} 스냅샷 생성</b> — ${esc(summary)}`});
    if(wasConfirmed){
      slot.activities.push({type:'invalidate', who:'시스템', time:'방금 전', body:`이전 컨펌(${esc(prevVer)}) 자동 무효화 — 재검토 필요 (REQ-WF-005)`});
    }
    // REQ-WF-005: 직속 하류 컨펌 슬롯에 '검토 권장' 배지 전파
    Object.keys(UPSTREAM).forEach(ds => {
      if(UPSTREAM[ds]===slug && DATA.slot[ds] && DATA.slot[ds].status==='confirmed'){ DATA.slot[ds].upstreamChanged = true; }
    });
    state.viewVersion[slug] = null;
    closeModals();
    rerender();
    toast(`${next} draft 스냅샷 생성${wasConfirmed?' — 이전 컨펌 무효화':''}`, 'success');
    return;
  }
  if(a==='ack-upstream'){
    const slot = DATA.slot[t.dataset.slot];
    if(slot){
      slot.upstreamChanged = false;
      slot.activities = slot.activities || [];
      slot.activities.push({type:'upstream', who:{pm:'PM',client:'고객사',admin:'관리자'}[state.role]||'PM', time:'방금 전', body:`선행 산출물 변경 <b>검토 완료(영향 없음)</b> — 현재 버전 유지`});
    }
    rerender();
    toast('검토 완료 — 영향 없음으로 처리','success');
    return;
  }
  if(a==='open-url'){ toast(`링크 열기 (mock): ${t.dataset.url||''}`,'info'); return; }
  if(a==='add-link'){ openModal(modalAddLink(t.dataset.slot)); return; }
  if(a==='submit-add-link'){
    const slug = t.dataset.slot;
    const urlI = document.getElementById('linkUrl');
    const nameI = document.getElementById('linkName');
    if(!urlI || !urlI.value.trim()){ toast('URL을 입력해 주세요','danger'); return; }
    const slot = DATA.slot[slug];
    slot.files = slot.files || [];
    slot.files.push({kind:'url', name:(nameI && nameI.value.trim()) || '외부 링크', desc:'외부 링크', url:urlI.value.trim(), badge:'NEW'});
    closeModals();
    rerender();
    toast('외부 링크 추가됨','success');
    return;
  }

  // File ops
  if(a==='upload-file'){ toast('파일 추가됨 (mock) — draft 안 변경은 활동 이력 미기록','info'); return; }
  if(a==='replace-file'){
    const idx = +t.dataset.idx;
    const slug = t.dataset.slug;
    const inp = document.createElement('input');
    inp.type = 'file'; inp.style.display = 'none';
    inp.onchange = () => {
      const file = inp.files && inp.files[0];
      if(file){
        state.replacePending = {slug, idx, newName:file.name, newSize:fmtSize(file.size)};
        rerender();
      }
      inp.remove();
    };
    document.body.appendChild(inp);
    inp.click();
    return;
  }
  if(a==='cancel-replace'){ state.replacePending = null; rerender(); return; }
  if(a==='confirm-replace'){
    const p = state.replacePending;
    if(p && DATA.slot[p.slug] && DATA.slot[p.slug].files[p.idx]){
      const file = DATA.slot[p.slug].files[p.idx];
      file.name = p.newName; file.size = p.newSize; file.badge = '교체됨';
    }
    state.replacePending = null;
    rerender();
    toast('파일 교체 완료','success');
    return;
  }
  if(a==='delete-file'){
    const idx = +t.dataset.idx;
    const slug = t.dataset.slug;
    const file = DATA.slot[slug] && DATA.slot[slug].files[idx];
    const name = file ? file.name : '파일';
    openConfirm({
      title: '파일 삭제',
      body: `<b>${esc(name)}</b> 파일을 정말 삭제하시겠습니까?<span class="conf-note">현재 draft 버전에서 제거됩니다. 이전 버전 스냅샷은 그대로 보존됩니다.</span>`,
      confirmLabel: '삭제',
      danger: true,
      onConfirm: () => {
        if(DATA.slot[slug] && DATA.slot[slug].files[idx]) DATA.slot[slug].files.splice(idx, 1);
        rerender();
        toast('파일 삭제됨','info');
      },
    });
    return;
  }
  if(a==='confirm-yes'){
    const fn = state.confirmAction;
    state.confirmAction = null;
    closeModals();
    if(fn) fn();
    return;
  }
  if(a==='view-file'){ openModal(modalFileViewer(t.dataset.file, t.dataset.slug), true); return; }
  if(a==='download'){ toast(`${t.dataset.file} 다운로드 (mock)`,'info'); return; }

  // Comment
  if(a==='post-comment'){
    const ta = document.getElementById('newComment');
    if(ta && !ta.value.trim()){ toast('코멘트 내용을 입력해 주세요','danger'); return; }
    const slug = t.dataset.slug;
    if(slug && DATA.slot[slug]){
      const who = {pm:'PM', client:'고객사', admin:'관리자'}[state.role] || 'PM';
      const version = t.dataset.version || state.viewVersion[slug] || DATA.slot[slug].version;
      DATA.slot[slug].comments = DATA.slot[slug].comments || [];
      let group = DATA.slot[slug].comments.find((item) => item.version === version);
      if(!group){
        group = {version, items:[]};
        DATA.slot[slug].comments.push(group);
      }
      group.items.push({who, time:'방금 전', body:ta.value.trim(), own:state.role!=='admin'});
      rerender();
      toast(`${version} 스냅샷에 코멘트 등록됨`,'success');
      return;
    }
    if(ta) ta.value = '';
    toast('코멘트 등록됨','success');
    return;
  }
  if(a==='edit-comment'){
    state.editingComment = {slug:t.dataset.slug, version:t.dataset.version, idx:+t.dataset.idx};
    rerender();
    const ta = document.getElementById('editCommentTa');
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  if(a==='cancel-comment-edit'){ state.editingComment = null; rerender(); return; }
  if(a==='save-comment-edit'){
    const ec = state.editingComment;
    const ta = document.getElementById('editCommentTa');
    if(!ec || !ta){ state.editingComment = null; rerender(); return; }
    const val = ta.value.trim();
    if(!val){ toast('코멘트 내용을 입력해 주세요','danger'); return; }
    const group = (DATA.slot[ec.slug]?.comments || []).find(g => g.version === ec.version);
    if(group && group.items[ec.idx]){ group.items[ec.idx].body = val; group.items[ec.idx].edited = true; }
    state.editingComment = null;
    rerender();
    toast('코멘트 수정됨','success');
    return;
  }
  if(a==='delete-comment'){
    const slug = t.dataset.slug, version = t.dataset.version, idx = +t.dataset.idx;
    const isAdmin = state.role==='admin';
    openConfirm({
      title:'코멘트 삭제', confirmLabel:'삭제', danger:true,
      body:`이 코멘트를 삭제하시겠습니까?${isAdmin?'<span class="conf-note">관리자 강제 삭제 — 감사 로그에 기록됩니다.</span>':''}`,
      onConfirm:()=>{
        const group = (DATA.slot[slug]?.comments || []).find(g => g.version === version);
        if(group && group.items[idx]) group.items.splice(idx, 1);
        rerender();
        toast('코멘트 삭제됨'+(isAdmin?' (감사 로그 기록)':''), isAdmin?'danger':'info');
      },
    });
    return;
  }

  // Project switcher
  if(a==='proj-switch'){
    const rect = t.getBoundingClientRect();
    const items = DATA.projects.map(p => `<a class="item" data-route="/projects/${p.id}"><span>${esc(p.name)}</span><span class="meta">${p.progress}%</span></a>`).join('');
    openDropdown(items, rect.left, rect.bottom+4);
    e.stopPropagation();
    return;
  }

  if(a==='open-search'){ navigate('/projects/A/search'); return; }
  if(a==='notify'){
    const rect = t.getBoundingClientRect();
    openDropdown(`
      <div class="dd-head">알림 <span class="meta">새 알림 3건</span></div>
      <a class="item" data-route="/projects/A/deliverables/design"><span>시안 v2 컨펌 대기 — 디자인 시안</span><span class="meta">2h</span></a>
      <a class="item" data-route="/projects/A/requirements"><span>요구사항 #12 코멘트</span><span class="meta">3h</span></a>
      <a class="item" data-route="/projects/A/defects/DEF-001"><span>결함 DEF-001 미해결 (High)</span><span class="meta">1d</span></a>
    `, rect.right - 280, rect.bottom + 6);
    e.stopPropagation();
    return;
  }
  if(a==='acct'){
    const rect = t.getBoundingClientRect();
    openDropdown(`
      <a class="item" data-route="/account"><span>계정 설정</span></a>
      ${state.role==='admin'?'<a class="item" data-route="/admin/teams"><span>관리자 메뉴</span></a>':''}
      <div class="divider"></div>
      <a class="item" data-action="logout"><span>로그아웃</span></a>
    `, rect.right - 200, rect.bottom + 4);
    e.stopPropagation();
    return;
  }
  if(a==='logout'){
    closeDropdowns();
    openConfirm({
      title:'로그아웃', confirmLabel:'로그아웃', danger:false,
      body:'로그아웃하시겠습니까?<span class="conf-note">진행 중인 작업이 저장되지 않았다면 먼저 저장해 주세요.</span>',
      onConfirm:()=>{ navigate('/login'); toast('로그아웃되었습니다','info'); },
    });
    return;
  }

  // Auth
  if(a==='login-submit'){
    const em = $('#loginEmail').value.trim(), pw = $('#loginPw').value;
    if(!em || !pw){ const err=$('#loginErr'); err.style.display='block'; err.textContent='이메일과 비밀번호를 입력해 주세요'; return; }
    DATA.loginAttempts++;
    if(DATA.loginAttempts >= 5){ const err=$('#loginErr'); err.style.display='block'; err.textContent='로그인 시도 한도 초과. 10분 후 다시 시도해 주세요.'; return; }
    // Demo: 항상 성공
    navigate('/'); toast('환영합니다, ' + DATA.user[state.role].name + '님','success'); DATA.loginAttempts=0;
    return;
  }
  if(a==='reset-submit'){ closeModals(); toast('이메일이 등록되어 있으면 발송됩니다','info'); return; }
  if(a==='reset-confirm'){
    const pw = $('#newPw').value, c = $('#newPwConfirm').value;
    if(!pw || pw.length<8){ toast('비밀번호는 8자 이상이어야 합니다','danger'); return; }
    if(pw!==c){ toast('비밀번호 확인이 일치하지 않습니다','danger'); return; }
    navigate('/'); toast('비밀번호가 변경되었습니다','success');
    return;
  }
  if(a==='invite-accept'){ navigate('/projects/A'); toast('가입 완료 — A 프로젝트 대시보드','success'); return; }
  if(a==='invite-help'){ toast('관리자 또는 PM에게 문의하세요. 계정이 있는 경우 비밀번호 재설정 사용','info'); return; }

  // Account
  if(a==='save-account'){ toast('계정 정보 저장됨','success'); return; }
  if(a==='save-password'){ toast('비밀번호 변경됨','success'); return; }

  // Project new
  if(a==='create-project'){ navigate('/projects/A'); toast('프로젝트 생성 완료 — 워크스페이스 초기화됨','success'); return; }

  // Settings
  if(a==='save-settings'){ toast('설정 저장됨 (감사 로그 기록)','success'); return; }

  // Members
  if(a==='invite-member'){ openModal(modalInviteMember()); return; }
  if(a==='submit-invite-member'){ closeModals(); toast('팀원 초대 메일 발송됨 (30분 유효)','success'); return; }
  if(a==='invite-client'){ openModal(modalInviteClient(t.dataset.context==='admin' ? {scope:'admin'} : {scope:'project', project:'A 프로젝트'})); return; }
  if(a==='submit-invite-client'){
    const inp = document.getElementById('inviteEmail');
    const email = inp ? inp.value.trim() : '';
    const scope = t.dataset.scope || 'project';
    const existing = findClientByEmail(email);
    closeModals();
    if(existing){
      if(scope==='project' && clientInCurrentProject(email)){
        toast(`이미 이 프로젝트에 참여 중인 고객사입니다 (${existing.client})`,'info');
      } else {
        toast(`기존 고객사 (${existing.client}) — 프로젝트에 참여 추가됨 · 참여 알림 발송 (비밀번호 설정 없음)`,'success');
      }
    } else {
      toast('신규 고객사 초대 메일 발송됨 — 온보딩 토큰 30분 유효','success');
    }
    return;
  }
  if(a==='remove-client'){
    const email = t.dataset.email;
    DATA.members.clients = DATA.members.clients.filter(c => c.email !== email);
    rerender();
    toast('고객사를 이 프로젝트에서 제외했습니다 (계정·과거 이력은 보존)','info');
    return;
  }
  if(a==='edit-client-projects'){ openModal(modalEditClientProjects(t.dataset.email)); return; }
  if(a==='submit-edit-projects'){ closeModals(); toast('참여 프로젝트 변경 저장됨 — 신규 추가분에 참여 알림 발송','success'); return; }
  if(a==='resend-invite'){ openModal(modalResendInvite(t.dataset.email)); return; }
  if(a==='submit-resend'){ closeModals(); toast('이전 토큰 무효화 + 새 초대 메일 발송 (감사 로그 기록)','success'); return; }

  // Danger
  if(a==='archive-project'){ toast('프로젝트가 보관 처리되었습니다','info'); return; }
  if(a==='delete-project'){ openModal(modalDeleteProject()); return; }
  if(a==='submit-delete'){ closeModals(); navigate('/'); toast('프로젝트가 삭제되었습니다 (30일 내 복구 가능)','danger'); return; }

  // Tests / Defects
  if(a==='new-tc'){ openModal(modalNewTC()); return; }
  if(a==='import-tc'){ openModal(modalImportTC(), true); return; }
  if(a==='tc-template'){ toast('CSV 템플릿 다운로드 (mock)','info'); return; }
  if(a==='submit-import-tc'){ closeModals(); toast('CSV 일괄 가져오기 (UI 데모) — 실제 등록 연동은 구현 단계','info'); return; }
  if(a==='submit-new-tc'){
    const title = (document.getElementById('tcTitle').value||'').trim() || '새 TC';
    const n = DATA.tests.length + 1;
    DATA.tests.push({id:`TC-${String(n).padStart(3,'0')}`, title, phase:document.getElementById('tcPhase').value, priority:document.getElementById('tcPriority').value, status:'대기', assignee:document.getElementById('tcAssignee').value});
    closeModals(); rerender(); toast('TC 등록됨','success'); return;
  }
  if(a==='new-defect'){ openModal(modalNewDefect()); return; }
  if(a==='new-defect-from-tc'){ openModal(modalNewDefect(t.dataset.tc)); return; }
  if(a==='link-defect'){ openModal(modalLinkDefect(t.dataset.tc), true); return; }
  if(a==='submit-link-defect'){ const n = document.querySelectorAll('.modal-body input[type=checkbox]:checked').length; closeModals(); toast(`기존 결함 ${n}건 연결됨`,'success'); return; }
  if(a==='submit-new-defect'){
    const title = (document.getElementById('defTitle').value||'').trim() || '새 결함';
    const n = DATA.defects.length + 1;
    const tcId = document.getElementById('defLinkTc').value;
    DATA.defects.push({id:`DEF-${String(n).padStart(3,'0')}`, title, severity:document.getElementById('defSeverity').value, status:'미해결', assignee:document.getElementById('defAssignee').value, created:'05-21', tcId: tcId || null});
    closeModals(); rerender(); toast(tcId ? `결함 등록됨 · ${tcId} 연결` : '결함 등록됨','success'); return;
  }
  if(a==='tc-result'){ toast(`TC 결과: ${t.dataset.r}`,t.dataset.r==='실패'?'danger':'success'); return; }
  if(a==='defect-status'){ toast(`상태 변경: ${t.dataset.s}`,'success'); return; }
  if(a==='add-attachment'){ toast('첨부 추가 (mock)','info'); return; }
  if(a==='change-assignee'){ openModal(modalChangeAssignee(t.dataset.id)); return; }
  if(a==='submit-change-assignee'){
    const id = t.dataset.id; const v = document.getElementById('defNewAssignee').value;
    const d = DATA.defects.find(x => x.id === id); if(d) d.assignee = v;
    closeModals(); rerender(); toast(`담당자가 ${v}(으)로 변경되었습니다`,'success'); return;
  }

  // Admin
  if(a==='new-admin-team'){ openModal(modalNewAdminTeam()); return; }
  if(a==='submit-new-admin-team'){
    const name = (document.getElementById('atName').value||'').trim() || '새 팀원';
    DATA.adminTeams.push({name, email:(document.getElementById('atEmail').value||'').trim()||'member@agency.com', role:document.getElementById('atRole').value, projects:0, active:false});
    closeModals(); rerender(); toast('프로젝트팀 계정 초대 메일 발송됨 — 수락 시 활성','success'); return;
  }

  // Version dropdown
  if(a==='version-dropdown'){
    const slug = t.dataset.slot;
    const slot = DATA.slot[slug];
    const versions = VERSIONS[slug] || [];
    const latestV = slot.version;
    const viewV = state.viewVersion[slug] || latestV;
    const rect = t.getBoundingClientRect();
    const items = [...versions].reverse().map(ver => {
      const isLatest = ver.v === latestV;
      const st = isLatest ? slot.status : ver.status;
      return `<a class="item ${ver.v===viewV?'active':''}" data-action="select-version" data-slug="${slug}" data-v="${esc(ver.v)}"><span>${esc(ver.v)}${isLatest?' (최신)':''}</span><span class="meta">${STATUS_LABEL[st]||st}</span></a>`;
    }).join('');
    openDropdown(items, rect.right-220, rect.bottom+4);
    e.stopPropagation();
    return;
  }
  if(a==='select-version'){
    const slug = t.dataset.slug, v = t.dataset.v;
    const latestV = DATA.slot[slug].version;
    if(v === latestV){ delete state.viewVersion[slug]; } else { state.viewVersion[slug] = v; }
    closeDropdowns();
    rerender();
    return;
  }

  // System
  if(a==='back'){ history.back(); return; }
  if(a==='reload'){ location.reload(); return; }

  // Fallback
  closeDropdowns();
});

// Click outside to close dropdowns
document.addEventListener('click', e => {
  if(!e.target.closest('.dropdown') && !e.target.closest('[data-action]')){ closeDropdowns(); }
});
// ESC to close modal/dropdown
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeModals(); closeDropdowns(); } });
// Click backdrop
document.addEventListener('click', e => { if(e.target.classList.contains('modal-backdrop')){ closeModals(); }});
// 초대 모달 이메일 입력 → 신규/기존 판별 힌트
document.addEventListener('input', e => { if(e.target && e.target.id==='inviteEmail') updateInviteHint(); });

/* Role switcher */
document.querySelectorAll('.role-switcher button[data-role]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.role-switcher button[data-role]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.role = b.dataset.role;
    toast('역할 전환: ' + b.textContent,'info');
    navigateRender();
  });
});

/* Initial render */
if(!location.hash){ location.hash = '#/projects/A'; }
navigateRender();
</script>
</body>
</html>
