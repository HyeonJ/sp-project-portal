<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>sp-project-portal · 프로토타입 v1</title>
<style>
/* ========== Design Tokens (A. Precision grid) ========== */
:root{
  --bg:oklch(99% .002 240);--surface:oklch(100% 0 0);--surface-2:oklch(98% .003 240);--surface-3:oklch(96% .004 240);
  --fg:oklch(18% .012 250);--fg-2:oklch(28% .014 250);--muted:oklch(54% .012 250);--muted-2:oklch(68% .010 250);
  --border:oklch(92% .005 250);--border-strong:oklch(86% .007 250);--divider:oklch(94% .004 250);
  --accent:oklch(58% .18 255);--accent-hover:oklch(52% .19 255);--accent-soft:oklch(96% .04 255);--accent-deep:oklch(38% .18 255);
  --ok:oklch(48% .16 145);--ok-soft:oklch(96% .07 145);--warn:oklch(56% .13 75);--warn-soft:oklch(96% .08 75);--hot:oklch(56% .18 25);--hot-soft:oklch(96% .06 25);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Noto Sans KR',system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Noto Sans KR',system-ui,sans-serif;
  --mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0}
code{font-family:var(--mono);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--fg-2)}

/* ========== Layout - project ========== */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.app.no-sidebar{grid-template-columns:1fr}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sidebar .brand{display:flex;flex-direction:column;padding:8px 10px 14px;border-bottom:1px solid var(--border);margin-bottom:12px;cursor:pointer}
.sidebar .brand:hover{background:var(--surface-2);border-radius:8px}
.sidebar .brand .logo{font:700 14px/1.2 var(--font-display);letter-spacing:-.01em}
.sidebar .brand .proj{font-size:12px;color:var(--muted);margin-top:4px}
.sidebar .brand .proj small{display:block;color:var(--muted-2);font-size:11px;margin-top:1px}
.sidebar nav{display:flex;flex-direction:column;gap:1px}
.sidebar .nav-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--fg-2);cursor:pointer}
.sidebar .nav-item:hover{background:var(--surface-2);text-decoration:none}
.sidebar .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sidebar .nav-item.locked{color:var(--muted-2)}
.sidebar .nav-item .tag{font:500 10px/1 var(--mono);color:var(--muted);background:var(--surface-2);padding:3px 7px;border-radius:99px;border:1px solid var(--border)}
.sidebar .nav-item.active .tag{color:var(--accent);background:#fff;border-color:var(--accent)}
.sidebar .nav-item.locked .tag{color:var(--muted-2)}
.sidebar .sub{padding-left:18px;font-size:12px;color:var(--muted)}
.sidebar .sub.active{color:var(--accent);font-weight:600}
.sidebar .group{font:600 10px/1 var(--mono);color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px;border-top:1px solid var(--divider);margin-top:10px}
.sidebar .group:first-of-type{border-top:0;margin-top:4px}

/* ========== Topbar ========== */
.topbar{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:11px 28px;display:flex;align-items:center;gap:14px;z-index:10}
.topbar.no-sidebar{padding:12px 32px}
.topbar .breadcrumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.topbar .breadcrumb a{color:var(--muted)}.topbar .breadcrumb a:hover{color:var(--fg)}
.topbar .breadcrumb b{color:var(--fg);font-weight:600}
.topbar .breadcrumb .sep{color:var(--muted-2)}
.topbar .proj-switcher{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;cursor:pointer;font-weight:500}
.topbar .proj-switcher:hover{border-color:var(--border-strong);background:var(--surface-2)}
.topbar .proj-switcher .arrow{color:var(--muted);font-size:10px}
.topbar .spacer{flex:1}
.topbar .search{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--muted);min-width:240px;cursor:pointer;display:flex;align-items:center;gap:8px}
.topbar .search:hover{border-color:var(--border-strong)}
.topbar .search .kbd{margin-left:auto;font:500 10px/1 var(--mono);background:var(--surface-2);border:1px solid var(--border);padding:2px 6px;border-radius:4px;color:var(--muted-2)}
.topbar .icon-btn{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);position:relative}
.topbar .icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.topbar .icon-btn .dot{position:absolute;width:7px;height:7px;background:var(--hot);border-radius:50%;top:8px;right:8px;border:2px solid var(--surface)}
.topbar .acct{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border:1px solid var(--border);border-radius:99px;cursor:pointer}
.topbar .acct:hover{background:var(--surface-2)}
.topbar .acct .avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 var(--font)}
.topbar .acct .name{font-size:13px;color:var(--fg-2)}
.topbar .acct .arrow{color:var(--muted);font-size:10px}

/* ========== Content ========== */
.main{padding:24px 32px 80px;max-width:1320px}
.page-title{font:700 24px/1.2 var(--font-display);letter-spacing:-.015em;margin:0 0 6px}
.page-sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.page-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}

/* ========== Card ========== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card.flat{box-shadow:none}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.card-head h3{font:700 15px/1.2 var(--font);letter-spacing:-.005em}
.card-head .meta{font:500 11px/1 var(--mono);color:var(--muted)}
.card-list{display:flex;flex-direction:column;gap:1px}
.card-list .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--divider);cursor:pointer;border-radius:4px}
.card-list .item:hover{background:var(--surface-2);padding-left:8px;padding-right:8px}
.card-list .item:last-child{border-bottom:0}
.card-list .item .body{font-size:13px;color:var(--fg-2);flex:1}
.card-list .item .body b{color:var(--fg);font-weight:600}
.card-list .item .t{font:500 11px/1 var(--mono);color:var(--muted);white-space:nowrap}

/* ========== Grid ========== */
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.grid.cols-4{grid-template-columns:1fr 1fr}}
@media (max-width:780px){.app{grid-template-columns:1fr}.sidebar{display:none}.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}.main{padding:16px}}

/* ========== Buttons ========== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;font:600 13px/1 var(--font);border:1px solid var(--border);background:var(--surface);color:var(--fg);transition:all .12s ease;white-space:nowrap}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{background:var(--surface);color:var(--hot);border-color:color-mix(in oklch,var(--hot) 30%,white)}
.btn.danger:hover{background:var(--hot-soft)}
.btn.danger-solid{background:var(--hot);color:#fff;border-color:var(--hot)}
.btn.danger-solid:hover{background:color-mix(in oklch,var(--hot) 90%,black);border-color:color-mix(in oklch,var(--hot) 90%,black)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled,.btn.locked{opacity:.5;cursor:not-allowed;background:var(--surface-2)}
.btn:disabled:hover,.btn.locked:hover{background:var(--surface-2);border-color:var(--border)}
.btn .role-tag{font:500 10px/1 var(--mono);color:var(--muted);padding:2px 5px;background:var(--surface-2);border-radius:4px;margin-right:2px}
.btn.primary .role-tag{color:#fff;background:rgba(255,255,255,.18)}
.btn.danger .role-tag{color:var(--hot);background:var(--hot-soft)}

/* ========== Pill ========== */
.pill{display:inline-flex;align-items:center;font:600 11px/1 var(--font);padding:4px 9px;border-radius:99px;border:1px solid var(--border);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in oklch,var(--ok) 25%,white)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in oklch,var(--warn) 25%,white)}
.pill.hot{background:var(--hot-soft);color:var(--hot);border-color:color-mix(in oklch,var(--hot) 25%,white)}
.pill.muted{color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in oklch,var(--accent) 25%,white)}
.pill.lg{padding:6px 12px;font-size:12px}

/* ========== Project header (dashboard) ========== */
.proj-header{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.proj-header h1{font:700 24px/1.2 var(--font-display);letter-spacing:-.015em}
.proj-header .meta{margin:6px 0 0;color:var(--muted);font-size:13px}
.proj-header .stage{margin:10px 0 0;font-size:13px;color:var(--fg-2)}
.proj-header .stage b{color:var(--fg)}
.gate-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font:600 12px/1 var(--font);background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in oklch,var(--warn) 24%,white)}
.gate-badge.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in oklch,var(--ok) 24%,white)}
.progress{margin-top:14px}
.progress .bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.progress .label{margin-top:6px;font:500 12px/1 var(--mono);color:var(--muted);display:flex;justify-content:space-between}

/* ========== Action bar (dashboard) ========== */
.action-bar{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.action-bar .label{font:600 12px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:8px}

/* ========== Deliverable box ========== */
.deliverable{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .12s ease}
.deliverable:hover{border-color:var(--accent);background:var(--accent-soft)}
.deliverable .stage-num{font:600 10px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.deliverable .name{margin:6px 0;font:700 14px/1.2 var(--font);letter-spacing:-.005em}

/* ========== Modal ========== */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,30,50,.42);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:min(560px,92vw);max-height:90vh;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden;animation:popin .14s ease;display:flex;flex-direction:column}
.modal.lg{width:min(720px,92vw)}
@keyframes popin{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font:700 16px/1.2 var(--font);letter-spacing:-.005em}
.modal-head .close{font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.modal-head .close:hover{background:var(--surface-2);color:var(--fg)}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}
.modal-body .row{display:flex;gap:12px;align-items:flex-start}
.modal-body .row label{flex:0 0 110px;color:var(--muted);font:500 12px/1.6 var(--font);padding-top:8px}
.modal-body .row label small{display:block;color:var(--muted-2);font-size:10px;margin-top:2px}
.modal-body .row .value{flex:1;font-size:13px;min-width:0}
.modal-body .row .value.static{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;color:var(--fg-2)}
.modal-body input[type=text],.modal-body input[type=email],.modal-body input[type=password],.modal-body input[type=date],.modal-body textarea,.modal-body select{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:7px;padding:9px 11px;color:var(--fg);outline:none}
.modal-body input:focus,.modal-body textarea:focus,.modal-body select:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.modal-body textarea{min-height:64px;resize:vertical;font:inherit}
.modal-body .radio-group{display:flex;gap:18px;font-size:13px;padding-top:6px}
.modal-body .radio-group label{flex:none;color:var(--fg);padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.modal-body .note{padding:11px 13px;background:var(--accent-soft);border-radius:8px;font-size:12px;line-height:1.7;color:var(--accent-deep);border-left:3px solid var(--accent)}
.modal-body .note.warn{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn)}
.modal-body .note.danger{background:var(--hot-soft);color:var(--hot);border-left-color:var(--hot)}
.modal-body .file-list{display:flex;flex-direction:column;gap:6px}
.modal-body .file-row{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--border);border-radius:7px;font-size:12px}
.modal-body .file-row .name{flex:1;color:var(--fg-2)}
.modal-body .file-row .name b{color:var(--fg)}
.modal-body .file-row .actions{display:flex;gap:4px}
.modal-body .gate-check{display:flex;flex-direction:column;gap:7px;background:var(--surface-2);padding:12px 14px;border-radius:8px}
.modal-body .gate-check .gate-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.modal-body .gate-check .gate-row.ok{color:var(--ok)}
.modal-body .gate-check .gate-row .checkmark{font-weight:700}
.modal-body .input-list{display:flex;flex-direction:column;gap:6px}
.modal-body .input-list .item{display:flex;justify-content:space-between;padding:7px 11px;background:var(--surface-2);border-radius:6px;font-size:13px}
.modal-body .input-list .item .t{font:500 11px/1 var(--mono);color:var(--muted)}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2)}
.modal-body .err{color:var(--hot);font-size:12px;margin-top:4px}

/* ========== Dropdown ========== */
.dropdown{position:absolute;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:6px;z-index:60;min-width:220px;animation:popin .12s ease}
.dropdown .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:13px;color:var(--fg-2);cursor:pointer}
.dropdown .item:hover{background:var(--surface-2);color:var(--fg)}
.dropdown .item .meta{font:500 10px/1 var(--mono);color:var(--muted)}
.dropdown .item.active{background:var(--accent-soft);color:var(--accent)}
.dropdown .divider{height:1px;background:var(--divider);margin:5px 4px}

/* ========== Toast ========== */
.toast-area{position:fixed;bottom:24px;right:24px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--fg);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;animation:slidein .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.16);pointer-events:auto;max-width:380px}
.toast.success{background:var(--ok)}
.toast.danger{background:var(--hot)}
.toast.info{background:var(--accent)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ========== Role switcher ========== */
.role-switcher{position:fixed;bottom:24px;left:24px;background:var(--surface);border:1px solid var(--border-strong);border-radius:99px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.1);display:flex;gap:4px;z-index:40;align-items:center}
.role-switcher .label{font:500 11px/1 var(--mono);color:var(--muted);padding:0 4px 0 8px}
.role-switcher button{padding:7px 12px;border-radius:99px;font:600 11px/1 var(--font);color:var(--muted)}
.role-switcher button.active{background:var(--accent);color:#fff}

/* ========== Table ========== */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--divider)}
.tbl th{font:600 11px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);border-bottom:1px solid var(--border)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td.id-cell{font:600 12px/1 var(--mono);color:var(--accent)}
.tbl td.actions{text-align:right;white-space:nowrap}

/* ========== Filter bar ========== */
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter{padding:6px 11px;border:1px solid var(--border);border-radius:99px;font-size:12px;color:var(--fg-2);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.filter:hover{border-color:var(--border-strong);background:var(--surface-2)}
.filter .arrow{font-size:9px;color:var(--muted)}
.filter.search-input{padding:5px 11px;flex:1;min-width:180px;background:var(--surface-2)}
.filter.search-input input{border:0;background:transparent;outline:none;width:100%;font-size:12px}

/* ========== Stat cards ========== */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .label{font:500 11px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .value{font:700 24px/1 var(--font-display);letter-spacing:-.01em}
.stat .delta{font-size:12px;color:var(--muted)}

/* ========== Form rows ========== */
.form{display:flex;flex-direction:column;gap:14px}
.form .row{display:flex;gap:12px;align-items:flex-start}
.form .row label{flex:0 0 140px;color:var(--muted);font:500 13px/1.6 var(--font);padding-top:8px}
.form .row label small{display:block;color:var(--muted-2);font-size:10px;margin-top:2px}
.form .row .value{flex:1;font-size:13px;min-width:0}
.form input[type=text],.form input[type=email],.form input[type=password],.form input[type=date],.form textarea,.form select{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:9px 11px;color:var(--fg);outline:none}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form textarea{min-height:64px;resize:vertical;font:inherit}
.form .static{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;color:var(--fg-2)}

/* ========== Tabs (deliverables) ========== */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px;gap:2px}
.tab{padding:10px 16px;font:600 13px/1 var(--font);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ========== Activity timeline ========== */
.activity{display:flex;flex-direction:column;gap:1px}
.activity .item{display:flex;gap:12px;padding:14px 4px;border-bottom:1px solid var(--divider)}
.activity .item:last-child{border-bottom:0}

  return null;
}

function navigateRender(){
  closeDropdowns();
  closeModals();
  const path = location.hash.slice(1) || '/projects/A';
  state.currentRoute = '#' + path;
  const route = match(path);
  if(!route){ renderLayoutWith('system', renderError({code:'404'})); return; }
  const content = route.render(route.params);
  renderLayoutWith(route.layout, content, route.params, route.active);
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', navigateRender);

 * LAYOUT
 * ============================================================ */
function renderLayoutWith(layout, content, params={}, activeKey=null){
  const app = $('#app');
  if(layout === 'auth' || layout === 'system'){
    app.innerHTML = content;
    return;
  }
  if(layout === 'global'){
    app.innerHTML = `
      <div class="app no-sidebar">
        <div>
          ${renderTopbar('global', params)}
          <main class="main">${content}</main>
        </div>
      </div>`;
    return;
  }
  if(layout === 'admin'){
    app.innerHTML = `
      <div class="app">
        ${renderAdminSidebar(activeKey || (location.hash.includes('teams') ? 'teams' : location.hash.includes('clients') ? 'clients' : 'audit'))}
        <div>
          ${renderTopbar('admin', params)}
          <main class="main">${content}</main>
        </div>
      </div>`;
    return;
  }
  // project
  const projId = params.id || 'A';
  const proj = DATA.projects.find(p=>p.id===projId) || DATA.projects[0];
  app.innerHTML = `
    <div class="app">
      ${renderProjectSidebar(proj, activeKey, params)}
      <div>
        ${renderTopbar('project', {proj, ...params})}
        <main class="main">${content}</main>
      </div>
    </div>`;
}

/* 슬롯 페이지 공통 (요구사항 + 산출물) */
function renderSlotPage({slot, slug, title, subtitle, isDeliverable=false}){
  const role = state.role;
  const isDraft = slot.status === 'draft';
  const isLocked = !isDraft;
  const statusBadge = {
    draft: '<span class="pill warn">draft (작성 중)</span>',
    'pending-review': '<span class="pill warn">검토중 (잠김)</span>',
    confirmed: '<span class="pill ok">✓ 컨펌 완료</span>',
    rejected: '<span class="pill hot">반려</span>',
  }[slot.status];

  // file list
  const filesHtml = slot.files.length ? slot.files.map((f,i) => html`
    <div class="file">
      <span class="icn">📄</span>
      <div class="name">
        <b>${esc(f.name)}</b>
        <span class="sub">${esc(f.size)} · ${esc(f.desc)}</span>
      </div>
      ${f.badge ? `<span class="badge" style="background:${f.badge==='NEW'?'#cfe2ff':'var(--surface-2)'};color:${f.badge==='NEW'?'#0a4b8a':'var(--muted)'}">${esc(f.badge)}</span>` : ''}
      <div class="actions">
        <button class="btn sm ghost" data-action="download" data-file="${esc(f.name)}">다운로드</button>
        ${(isDraft && role==='pm') ? `
          <button class="btn sm ghost" data-action="replace-file" data-idx="${i}">교체</button>
          <button class="btn sm ghost" data-action="delete-file" data-idx="${i}">삭제</button>` : ''}
      </div>
    </div>`).join('') : '<div class="empty"><span class="ico">📁</span><p>파일 없음 — [+ 파일 업로드]로 시작</p></div>';

  // activities
  const actHtml = slot.activities.map(a => html`
    <div class="activity-item activity"><div class="item">
      <span class="icon ${a.type}">${({upload:'📦', review:'📨', reject:'⛔', approve:'✅', comment:'💬'})[a.type]}</span>
      <div class="body">
        <div class="meta"><b>${esc(a.who)}</b> · ${esc(a.time)} · ${({upload:'새 버전 생성', review:'검토 요청', reject:'반려', approve:'컨펌', comment:'코멘트'})[a.type]}${a.tag?` <span style="color:var(--hot)">(${esc(a.tag)})</span>`:''}</div>
        <div class="desc">${a.body}</div>
        ${a.own ? `<div class="actions"><button class="btn sm ghost" data-action="edit-comment">수정</button><button class="btn sm ghost" data-action="delete-comment">삭제</button></div>` : ''}
      </div>
    </div></div>`).join('');

  // version dropdown
  const versionLabel = `${slot.version}${isDraft ? ' · draft (최신, 미발송)' : isLocked && slot.status==='confirmed' ? ' (최신, 컨펌)' : ' (최신)'}`;

  // actions
  let actions = '';
  if(role === 'pm'){
    actions = html`
      <button class="btn" data-action="open-new-version" data-slot="${slug}">+ 새 버전 만들기</button>
      ${isDraft ? `<button class="btn primary" data-action="open-review" data-slot="${slug}">검토 요청 발송</button>` :
        `<button class="btn locked" title="draft에서만 활성">검토 요청 발송</button>`}
      <button class="btn locked">[고객] 컨펌</button>
      <button class="btn locked">[고객] 반려</button>`;
  } else if(role === 'client'){
    if(slot.status === 'pending-review'){
      actions = html`
        <button class="btn locked">+ 새 버전 만들기</button>
        <button class="btn locked">검토 요청 발송</button>
        <button class="btn primary" data-action="open-approve" data-mode="approve" data-slot="${slug}">컨펌</button>
        <button class="btn danger" data-action="open-approve" data-mode="reject" data-slot="${slug}">반려</button>`;
    } else {
      actions = `<button class="btn locked">컨펌 (검토 요청 수신 시 활성)</button>`;
    }
  } else {
    actions = `<span style="color:var(--muted);font-size:12px">관리자: 조회만 가능. 편집·컨펌 권한 없음.</span>`;
  }

  return html`
    <div class="page-bar">
      <div>
        <h1 class="page-title">${esc(title)}</h1>
        <p class="page-sub">${esc(subtitle)} · 마지막 편집 ${esc(slot.updated)}</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${statusBadge}
        <button class="btn sm" data-action="version-dropdown" data-slot="${slug}">${esc(versionLabel)} ▾</button>
      </div>
    </div>

    <section class="card" style="margin-bottom:14px">
      <div class="card-head">
        <h3>파일 묶음 (${slot.version} 스냅샷 — ${slot.files.length}개)</h3>
        <span class="meta">${isDraft ? '편집 가능 · 검토 요청 시 잠금' : '읽기 전용 · 다운로드만'}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">${filesHtml}</div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
        <button class="btn ${isDraft && role==='pm' ? 'primary':'locked'}" ${isDraft && role==='pm' ? 'data-action="upload-file" data-slot="'+slug+'"':''}>+ 파일 업로드</button>
        <span style="font-size:11px;color:var(--muted)">${isDraft ? '현재 버전에 파일 추가 — OS 다이얼로그 (모달 없음, 인-페이지)' : 'draft 상태에서만 활성. 변경하려면 [+ 새 버전 만들기].'}</span>
      </div>
      ${slot.status==='confirmed' && role==='pm' ? `<div class="state-info" style="margin-top:12px;border-color:color-mix(in oklch,var(--warn) 30%,white);color:var(--warn)">⚠ 컨펌 완료 상태에서 새 버전 생성 시 <b>이전 컨펌 자동 무효화 → 상태 '검토중' 복귀</b> (REQ-WF-005)</div>`:''}
    </section>

    <section class="card" style="margin-bottom:14px">
      <div class="card-head">
        <h3>활동 이력 (${slot.activities.length})</h3>
        <span class="meta">전체 버전 통합 · 시간순 · 영구 보존</span>
      </div>
      <div class="activity">${actHtml}</div>
      ${slot.status !== 'empty' ? html`
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--divider)">
          <textarea id="newComment" placeholder="자유 코멘트 작성 (최신 버전에서만)" style="width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:7px;padding:10px 12px;min-height:48px;outline:none;font:inherit"></textarea>
          <div style="text-align:right;margin-top:6px"><button class="btn primary sm" data-action="post-comment">등록</button></div>
          <p style="font-size:11px;color:var(--muted);margin-top:8px">※ 시스템 이벤트 자동 기록. 자유 코멘트 수정: 본인만 / 삭제: 본인 + 관리자(감사 로그). draft 안 파일 추가·교체·삭제는 활동 이력 미기록(Git commit 패턴).</p>
        </div>` : ''}
    </section>

    <section class="action-bar" style="margin-bottom:0">
      <span class="label">액션</span>
      ${actions}
    </section>`;
}

function modalNewVersion(slot){
  const slotName = {requirements:'요구사항 정의서', ia:'IA', design:'디자인 시안', prototype:'프로토타입', figma:'Figma'}[slot] || '요구사항 정의서';
  const files = DATA.slot[slot]?.files || DATA.slot.requirements.files;
  const curVer = DATA.slot[slot]?.version || 'v2';
  const nextVer = curVer === '-' ? 'v1' : (curVer.startsWith('v') ? 'v'+(parseInt(curVer.slice(1))+1) : curVer+'.+1');
  return `
    <div class="modal-head"><h2>새 버전 만들기 (${nextVer} 생성)</h2><button class="close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="row"><label>대상</label><div class="value static">A 프로젝트 — ${slotName}</div></div>
      <div class="row"><label>베이스 → 신규</label><div class="value static">${curVer} (파일 ${files.length}개) → <b>${nextVer}</b> (자동 증가)</div></div>
      <div class="row"><label>파일 묶음<small>(${curVer} 사본 자동 로드)</small></label><div class="value">
        <div class="file-list">
          ${files.map(f => `<div class="file-row"><span>📄</span><span class="name"><b>${esc(f.name)}</b> <span style="color:var(--muted);font-size:11px">— ${esc(curVer)} 베이스</span></span><div class="actions"><button class="btn sm ghost">교체</button><button class="btn sm ghost">삭제</button></div></div>`).join('')}
          <button class="btn sm" style="margin-top:4px">+ 파일 추가</button>
          <p style="font-size:10px;color:var(--muted);margin:6px 0 0">PDF · 문서 등 (50MB/파일). 다중 파일 자유.</p>
        </div>
      </div></div>
      <div class="row"><label>변경 요약<small>(필수)</small></label><div class="value"><textarea id="changeNote" placeholder="예: §5 NFR 보안 요구사항 추가, 오타 수정"></textarea><div id="noteErr" class="err" style="display:none">변경 요약을 입력해 주세요</div></div></div>
      <div class="note">· 생성 시 <b>${nextVer} 스냅샷이 draft 상태로 생성</b>, 활동 이력에 생성 이벤트 + 변경 요약 자동 기록<br>· draft 동안 파일 카드에서 직접 추가·교체·삭제 자유. [검토 요청 발송] 시 잠금<br>· 검토중·컨펌 상태에서 생성 시 자동 회수·무효화 (REQ-WF-001·005)</div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-action="close-modal">취소</button>
      <button class="btn primary" data-action="submit-new-version" data-slot="${slot}" data-next="${nextVer}">${nextVer} 생성 (draft)</button>
    </div>`;
}

/* ============================================================
 * EVENT DELEGATION
 * ============================================================ */
document.addEventListener('click', e => {
  // route
  const r = e.target.closest('[data-route]');
  if(r){ e.preventDefault(); navigate(r.dataset.route); closeDropdowns(); return; }

  // action
  const t = e.target.closest('[data-action]');
  if(!t){ closeDropdowns(); return; }
  const a = t.dataset.action;

  if(a==='close-modal'){ closeModals(); return; }

  // Review
  if(a==='open-review'){ openModal(modalReview(t.dataset.slot)); return; }
  if(a==='submit-review'){ closeModals(); toast('검토 요청 발송 완료 — 고객사에 이메일 전송','success'); return; }

  // Approve/Reject
  if(a==='open-approve'){ openModal(modalApprove(t.dataset.mode||'approve')); return; }
  if(a==='submit-approve'){
    const result = document.querySelector('input[name="result"]:checked').value;
    if(result==='reject' && !document.getElementById('rejectReason').value.trim()){
      document.getElementById('rejectErr').style.display='block';
      return;
    }
    closeModals();
    toast(result==='approve' ? '✓ Gate 13 컨펌 통과 — 다음 단계 진행' : '반려 처리됨 — 팀에 알림 발송', result==='approve' ? 'success' : 'danger');
    return;
  }

  // AI Build
  if(a==='open-ai-build'){ openModal(modalAiBuild()); return; }
  if(a==='export-locked'){ toast('Gate 22 통과 후 가능합니다','danger'); return; }

  // New version
  if(a==='open-new-version'){ openModal(modalNewVersion(t.dataset.slot||'requirements'),true); return; }
  if(a==='submit-new-version'){
    const note = document.getElementById('changeNote');
    if(!note.value.trim()){ document.getElementById('noteErr').style.display='block'; return; }
    const next = t.dataset.next; closeModals();
    toast(`${next} draft 스냅샷 생성 완료 — 활동 이력에 기록`, 'success');
    return;
  }

  // File ops
  if(a==='upload-file'){ toast('파일 추가됨 (mock) — draft 안 변경은 활동 이력 미기록','info'); return; }
  if(a==='replace-file'){ toast('파일 교체됨 (mock)','info'); return; }
  if(a==='delete-file'){ toast('파일 삭제됨 (mock)','info'); return; }
  if(a==='download'){ toast(`${t.dataset.file} 다운로드 (mock)`,'info'); return; }

  // Comment
  if(a==='post-comment'){
    const ta = document.getElementById('newComment');
    if(ta && !ta.value.trim()){ toast('코멘트 내용을 입력해 주세요','danger'); return; }
    if(ta) ta.value = '';
    toast('코멘트 등록됨','success');
    return;
  }
  if(a==='edit-comment'){ toast('코멘트 수정 모드 (mock)','info'); return; }
  if(a==='delete-comment'){ toast('코멘트 삭제됨' + (state.role==='admin'?' (관리자 강제 삭제 — 감사 로그 기록)':''),state.role==='admin'?'danger':'info'); return; }

  // Project switcher
  if(a==='proj-switch'){
    const rect = t.getBoundingClientRect();
    const items = DATA.projects.map(p => `<a class="item" data-route="/projects/${p.id}"><span>${esc(p.name)}</span><span class="meta">${p.progress}%</span></a>`).join('');
    openDropdown(items + `<div class="divider"></div><a class="item" data-route="/"><span>전체 프로젝트 목록</span><span class="meta">→</span></a>`, rect.left, rect.bottom+4);
    e.stopPropagation();
    return;
  }

  if(a==='open-search'){ navigate('/projects/A/search'); return; }
  if(a==='notify'){ toast('알림 — 새 알림 3건 (mock)','info'); return; }
  if(a==='acct'){
    const rect = t.getBoundingClientRect();
    openDropdown(`
      <a class="item" data-route="/account"><span>계정 설정</span></a>
      ${state.role==='admin'?'<a class="item" data-route="/admin/teams"><span>관리자 메뉴</span></a>':''}
      <div class="divider"></div>
      <a class="item" data-action="logout"><span>로그아웃</span></a>
    `, rect.right - 200, rect.bottom + 4);
    e.stopPropagation();
    return;
  }
  if(a==='logout'){ closeDropdowns(); navigate('/login'); toast('로그아웃되었습니다','info'); return; }

  // Auth
  if(a==='login-submit'){
    const em = $('#loginEmail').value.trim(), pw = $('#loginPw').value;
    if(!em || !pw){ const err=$('#loginErr'); err.style.display='block'; err.textContent='이메일과 비밀번호를 입력해 주세요'; return; }
    DATA.loginAttempts++;
    if(DATA.loginAttempts >= 5){ const err=$('#loginErr'); err.style.display='block'; err.textContent='로그인 시도 한도 초과. 10분 후 다시 시도해 주세요.'; return; }
    // Demo: 항상 성공
    navigate('/'); toast('환영합니다, ' + DATA.user[state.role].name + '님','success'); DATA.loginAttempts=0;
    return;
  }
  if(a==='reset-submit'){ closeModals(); toast('이메일이 등록되어 있으면 발송됩니다','info'); return; }
  if(a==='reset-confirm'){
    const pw = $('#newPw').value, c = $('#newPwConfirm').value;
    if(!pw || pw.length<8){ toast('비밀번호는 8자 이상이어야 합니다','danger'); return; }
    if(pw!==c){ toast('비밀번호 확인이 일치하지 않습니다','danger'); return; }
    navigate('/'); toast('비밀번호가 변경되었습니다','success');
    return;
  }
  if(a==='invite-accept'){ navigate('/projects/A'); toast('가입 완료 — A 프로젝트 대시보드','success'); return; }
  if(a==='invite-help'){ toast('관리자 또는 PM에게 문의하세요. 계정이 있는 경우 비밀번호 재설정 사용','info'); return; }

  // Account
  if(a==='save-account'){ toast('계정 정보 저장됨','success'); return; }
  if(a==='save-password'){ toast('비밀번호 변경됨','success'); return; }

  // Project new
  if(a==='create-project'){ navigate('/projects/A'); toast('프로젝트 생성 완료 — 워크스페이스 초기화됨','success'); return; }

  // Settings
  if(a==='save-settings'){ toast('설정 저장됨 (감사 로그 기록)','success'); return; }

  // Members
  if(a==='invite-client'){ openModal(modalInviteClient()); return; }
  if(a==='submit-invite-client'){ closeModals(); toast('초대 메일 발송됨 (30분 유효)','success'); return; }
  if(a==='resend-invite'){ openModal(modalResendInvite(t.dataset.email)); return; }
  if(a==='submit-resend'){ closeModals(); toast('이전 토큰 무효화 + 새 초대 메일 발송 (감사 로그 기록)','success'); return; }

  // Danger
  if(a==='archive-project'){ toast('프로젝트가 보관 처리되었습니다','info'); return; }
  if(a==='delete-project'){ openModal(modalDeleteProject()); return; }
  if(a==='submit-delete'){ closeModals(); navigate('/'); toast('프로젝트가 삭제되었습니다 (30일 내 복구 가능)','danger'); return; }

  // Tests / Defects
  if(a==='new-tc'){ toast('TC 등록 (mock)','info'); return; }
  if(a==='new-defect'){ toast('결함 등록 (mock)','info'); return; }
  if(a==='tc-result'){ toast(`TC 결과: ${t.dataset.r}`,t.dataset.r==='Fail'?'danger':'success'); return; }
  if(a==='defect-status'){ toast(`상태 변경: ${t.dataset.s}`,'success'); return; }
  if(a==='add-attachment'){ toast('첨부 추가 (mock)','info'); return; }
  if(a==='change-assignee'){ toast('담당자 변경 (mock)','info'); return; }

  // Admin
  if(a==='new-admin-team' || a==='new-admin-client'){ toast('계정 생성 폼 (mock)','info'); return; }

  // Version dropdown
  if(a==='version-dropdown'){
    const rect = t.getBoundingClientRect();
    openDropdown(`
      <a class="item active"><span>현재 버전 (최신)</span><span class="meta">▾</span></a>
      <a class="item"><span>v2</span><span class="meta">잠김</span></a>
      <a class="item"><span>v1</span><span class="meta">반려됨</span></a>
    `, rect.right-220, rect.bottom+4);
    e.stopPropagation();
    return;
  }

  // System
  if(a==='back'){ history.back(); return; }
  if(a==='reload'){ location.reload(); return; }

  // Fallback
  closeDropdowns();
});

// Click outside to close dropdowns
document.addEventListener('click', e => {
  if(!e.target.closest('.dropdown') && !e.target.closest('[data-action]')){ closeDropdowns(); }
});
// ESC to close modal/dropdown
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeModals(); closeDropdowns(); } });
// Click backdrop
document.addEventListener('click', e => { if(e.target.classList.contains('modal-backdrop')){ closeModals(); }});

/* Role switcher */
document.querySelectorAll('.role-switcher button[data-role]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.role-switcher button[data-role]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.role = b.dataset.role;
    toast('역할 전환: ' + b.textContent,'info');
    navigateRender();
  });
});

/* Initial render */
if(!location.hash){ location.hash = '#/projects/A'; }
navigateRender();
</script>
