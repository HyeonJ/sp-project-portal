<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 워크스페이스(전역) 사이드바 -->
<aside class="sidebar" th:fragment="globalSidebar(active)">
    <div class="brand">
        <a class="logo" th:href="@{/}">SoftPuzzle PM</a>
        <span class="proj">프로젝트 워크스페이스<small th:text="${navTier == 'admin'} ? '전체 시스템' : '내 프로젝트'">내 프로젝트</small></span>
    </div>
    <nav>
        <a class="nav-item" th:classappend="${active == 'projects'} ? 'active'" th:href="@{/}">
            <span>프로젝트 목록</span>
        </a>
        <a class="nav-item" id="navNewProject" th:if="${navCanCreate}"
           th:classappend="${active == 'new'} ? 'active'" href="javascript:void(0)">
            <span>새 프로젝트</span><span class="tag">+</span>
        </a>
        <th:block th:if="${navTier == 'admin'}">
            <div class="group">관리자</div>
            <a class="nav-item" th:classappend="${active == 'admin'} ? 'active'"
               th:href="@{/admin}"><span>관리자 콘솔</span></a>
        </th:block>
    </nav>
</aside>

<!-- 프로젝트 사이드바 -->
<aside class="sidebar" th:fragment="projectSidebar(active)">
    <div class="brand">
        <a class="logo" th:href="@{/}">SoftPuzzle PM</a>
        <span class="proj" th:text="${projName}">프로젝트<small
                th:text="${projClient} + (${projType} != null ? ' · ' + ${projType} : '')">고객사</small></span>
    </div>
    <nav>
        <a class="nav-item" th:classappend="${active == 'deliverables'} ? 'active'"
           th:href="@{/projects/{id}(id=${projId})}">
            <span>산출물</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'dev'} ? 'active'"
           th:href="@{/projects/{id}/dev(id=${projId})}">
            <span>개발</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'tests'} ? 'active'"
           th:href="@{/projects/{id}/test-cases(id=${projId})}">
            <span>TC</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'defects'} ? 'active'"
           th:href="@{/projects/{id}/defects(id=${projId})}">
            <span>결함</span>
        </a>
        <a class="nav-item" th:classappend="${active == 'settings'} ? 'active'"
           th:href="@{/projects/{id}/settings(id=${projId})}">
            <span>설정</span>
        </a>
    </nav>
</aside>

<!-- 상단바 공통 도구 (검색·알림) -->
<div th:fragment="topbarTools" style="display:flex;align-items:center;gap:10px">
    <form action="/search" method="get" style="margin:0">
        <input class="search" name="q" placeholder="⌕ 통합 검색"
               style="min-width:200px;border:1px solid var(--divider);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px">
    </form>
    <button class="icon-btn" id="notifBell" type="button" title="알림" aria-label="알림" style="position:relative">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
        </svg>
        <span class="dot" id="notifDot" hidden></span>
    </button>
</div>

<!-- 프로젝트 상단바 -->
<header class="topbar" th:fragment="projectTopbar(pageName)">
    <div class="breadcrumb">
        <a th:href="@{/}">프로젝트 목록</a> <span class="sep">/</span>
        <b th:text="${projName}">프로젝트</b> <span class="sep">/</span>
        <span th:text="${pageName}">산출물</span>
    </div>
    <div class="spacer"></div>
    <div th:replace="~{fragments/shell :: topbarTools}"></div>
    <div class="acct">
        <span class="avatar" th:text="${navUserInitial}">U</span>
        <span class="name" th:text="${navUserName}">사용자</span>
    </div>
    <form method="post" th:action="@{/logout}" style="margin:0">
        <button class="btn ghost sm" type="submit">로그아웃</button>
    </form>
</header>

<!-- 상단바 -->
<header class="topbar" th:fragment="topbar(pageName)">
    <div class="breadcrumb"><b th:text="${pageName}">페이지</b></div>
    <div class="spacer"></div>
    <div th:replace="~{fragments/shell :: topbarTools}"></div>
    <div class="acct">
        <span class="avatar" th:text="${navUserInitial}">U</span>
        <span class="name" th:text="${navUserName}">사용자</span>
    </div>
    <form method="post" th:action="@{/logout}" style="margin:0">
        <button class="btn ghost sm" type="submit">로그아웃</button>
    </form>
</header>

</body>
</html>
