<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('새 프로젝트 · SoftPuzzle PM')}"></head>
<body>
<div class="app">
    <div th:replace="~{fragments/shell :: globalSidebar('new')}"></div>
    <div>
        <div th:replace="~{fragments/shell :: topbar('새 프로젝트')}"></div>
        <main class="main" id="projectNewPage">
            <h1 class="page-title">새 프로젝트</h1>

            <section class="card">
                <form id="newForm" class="form">
                    <div class="row"><label>프로젝트명</label><div class="value"><input type="text" name="name" placeholder="예: ACME 포털 구축" required maxlength="100"></div></div>
                    <div class="row"><label>고객사명</label><div class="value"><input type="text" name="clientOrgName" placeholder="예: ㈜ACME" required maxlength="100"></div></div>
                    <div class="row"><label>유형</label><div class="value"><select name="type"><option value="">선택</option><option>SaaS</option><option>웹사이트</option><option>모바일</option><option>기타</option></select></div></div>
                    <div class="row"><label>기간 <small class="opt">선택</small></label><div class="value" style="display:flex;gap:8px;align-items:center"><input type="date" name="startDate"> <span>~</span> <input type="date" name="endDate"></div></div>
                    <div class="row"><label>설명 <small class="opt">선택</small></label><div class="value"><textarea name="description" maxlength="5000" placeholder="프로젝트 설명"></textarea></div></div>
                </form>
                <div class="state-info" style="margin-top:18px">
                    생성 시 자동 초기화:<br>· 워크스페이스 (요구사항·산출물·결함)<br>· 진행 단계 1로 설정<br>· 생성자(현재 사용자)가 PM으로 자동 할당
                </div>
                <div id="newErr" class="err" style="display:none;color:var(--hot);margin-top:10px"></div>
                <div style="text-align:right;margin-top:14px;display:flex;justify-content:flex-end;gap:8px">
                    <a class="btn" th:href="@{/}">취소</a>
                    <button class="btn primary" type="button" id="createBtn">프로젝트 생성</button>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/project-new.js}" defer></script>
</body>
</html>
