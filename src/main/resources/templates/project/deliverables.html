<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('산출물 · SoftPuzzle PM')}"></head>
<body>
<div class="app">
    <div th:replace="~{fragments/shell :: projectSidebar('deliverables')}"></div>
    <div>
        <div th:replace="~{fragments/shell :: projectTopbar('산출물')}"></div>
        <main class="main" id="deliverables" th:attr="data-project-id=${projId}, data-can-edit=${canEdit}">
            <div class="page-bar">
                <h1 class="page-title">산출물</h1>
            </div>

            <div id="slotGrid" class="grid cols-3">
                <p class="page-sub">불러오는 중…</p>
            </div>

            <section id="slotDetail" class="card" hidden style="margin-top:18px"></section>
        </main>
    </div>
</div>
<script th:src="@{/js/deliverables.js}" defer></script>
</body>
</html>
