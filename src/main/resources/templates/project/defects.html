<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('결함 · SoftPuzzle PM')}"></head>
<body>
<div class="app">
    <div th:replace="~{fragments/shell :: projectSidebar('defects')}"></div>
    <div>
        <div th:replace="~{fragments/shell :: projectTopbar('결함')}"></div>
        <main class="main" id="defectPage" th:attr="data-project-id=${projId}, data-tier=${navTier}">
            <div class="page-bar">
                <h1 class="page-title">결함</h1>
                <button id="newDefectBtn" class="btn primary" type="button">+ 새 결함</button>
            </div>

            <section id="newDefectCard" class="card" hidden style="margin-bottom:16px">
                <div class="card-head"><h3>새 결함</h3></div>
                <form id="defectForm" class="form">
                    <div class="row"><label>제목</label><div class="value"><input type="text" name="title" required maxlength="200"></div></div>
                    <div class="row"><label>심각도</label><div class="value"><select name="severity"><option>Medium</option><option>High</option><option>Low</option></select></div></div>
                    <div class="row"><label>연결 TC <small class="opt">선택</small></label><div class="value"><select name="testCaseId"><option value="">없음</option></select></div></div>
                    <div class="row"><label>환경 <small class="opt">선택</small></label><div class="value"><input type="text" name="environment" placeholder="브라우저·OS·시각" maxlength="200"></div></div>
                    <div class="row"><label>재현 단계 <small class="opt">선택</small></label><div class="value"><textarea name="reproSteps"></textarea></div></div>
                    <div id="defectErr" class="err" style="display:none;color:var(--hot)"></div>
                    <div style="display:flex;gap:8px;justify-content:flex-end">
                        <button type="button" id="defectCancel" class="btn ghost">취소</button>
                        <button type="submit" class="btn primary">등록</button>
                    </div>
                </form>
            </section>

            <section class="card">
                <div class="card-head"><h3>목록</h3><span class="meta" id="defectCount"></span></div>
                <div id="defectList" class="card-list"><p class="page-sub" style="margin:0">불러오는 중…</p></div>
            </section>

            <section id="defectDetail" class="card" hidden style="margin-top:16px"></section>
        </main>
    </div>
</div>
<script th:src="@{/js/defects.js}" defer></script>
</body>
</html>
