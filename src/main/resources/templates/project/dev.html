<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('개발 · SoftPuzzle PM')}"></head>
<body>
<div class="app">
    <div th:replace="~{fragments/shell :: projectSidebar('dev')}"></div>
    <div>
        <div th:replace="~{fragments/shell :: projectTopbar('개발')}"></div>
        <main class="main" id="devPage" th:attr="data-project-id=${projId}, data-tier=${navTier}">
            <div class="page-bar">
                <h1 class="page-title">개발</h1>
            </div>
            <p class="page-sub">코드 자동 생성(REQ-DEV-001). 게이트 9·11·13·15(요구사항·IA·디자인·프로토타입) 전부 통과 후 시작할 수 있습니다.</p>

            <section class="card" style="margin-bottom:18px">
                <div class="card-head"><h3>사전조건</h3><span class="meta" id="readyMeta">확인 중…</span></div>
                <div id="precondition" class="action-bar" style="box-shadow:none"></div>
                <div style="margin-top:14px;display:flex;align-items:center;gap:12px">
                    <button id="devStartBtn" class="btn primary" type="button" disabled>개발 시작</button>
                    <span id="devMsg" class="page-sub" style="margin:0"></span>
                </div>
            </section>

            <section class="card">
                <div class="card-head"><h3>실행 이력</h3></div>
                <div id="runList" class="card-list"><p class="page-sub" style="margin:0">불러오는 중…</p></div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/dev.js}" defer></script>
</body>
</html>
