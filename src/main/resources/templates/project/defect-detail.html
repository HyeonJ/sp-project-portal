<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('결함 상세 · SoftPuzzle PM')}"></head>
<body>
<div class="app">
    <div th:replace="~{fragments/shell :: projectSidebar('defects')}"></div>
    <div>
        <div th:replace="~{fragments/shell :: projectTopbar('결함 상세')}"></div>
        <main class="main" id="defectDetailPage" th:attr="data-project-id=${projId}, data-defect-id=${defect.id}, data-tier=${navTier}">

            <div class="page-bar">
                <div>
                    <p class="page-sub" style="margin-bottom:4px"><a th:href="@{/projects/{id}/defects(id=${projId})}">← 결함 목록</a></p>
                    <h1 class="page-title" th:text="${defect.code} + ' · ' + ${defect.title}">DEF-001 · 제목</h1>
                    <p class="page-sub"
                       th:text="'등록 ' + (${defect.reporterName != null ? defect.reporterName : '-'}) + ' · ' + (${defect.createdAt != null ? #strings.substring(defect.createdAt.toString(),0,10) : '-'}) + ' · 담당 ' + (${defect.assigneeName != null ? defect.assigneeName : '-'})">등록 정보</p>
                </div>
                <div style="display:flex;gap:8px;align-items:center">
                    <button class="btn sm" type="button" id="defectEditBtn"
                            th:if="${navTier == 'team' or (navTier == 'client' and defect.reporterId == navUserId)}">수정</button>
                    <span th:switch="${defect.severity}">
                        <span th:case="'High'" class="pill hot lg">High</span>
                        <span th:case="'Low'" class="pill muted lg">Low</span>
                        <span th:case="*" class="pill warn lg">Medium</span>
                    </span>
                    <span th:switch="${defect.status}">
                        <span th:case="'resolved'" class="pill ok lg">해결 완료</span>
                        <span th:case="'in_progress'" class="pill warn lg">진행 중</span>
                        <span th:case="'cannot_reproduce'" class="pill muted lg">재현 불가</span>
                        <span th:case="*" class="pill hot lg">미해결</span>
                    </span>
                </div>
            </div>

            <div class="grid cols-2" style="margin-bottom:14px">
                <section class="card">
                    <div class="card-head"><h3>재현 단계</h3></div>
                    <p style="font-size:13px;line-height:1.8;white-space:pre-wrap"
                       th:text="${defect.reproSteps != null and !#strings.isEmpty(defect.reproSteps) ? defect.reproSteps : '—'}">재현 단계</p>
                </section>
                <section class="card">
                    <div class="card-head"><h3>환경</h3></div>
                    <p style="font-size:13px;line-height:1.8;white-space:pre-wrap"
                       th:text="${defect.environment != null and !#strings.isEmpty(defect.environment) ? defect.environment : '—'}">환경</p>
                </section>
            </div>

            <section class="card" style="margin-bottom:14px">
                <div class="card-head">
                    <h3 th:text="'첨부 (' + ${#lists.size(attachments)} + ')'">첨부</h3>
                    <label class="btn sm" th:if="${navTier == 'team'}" style="cursor:pointer">+ 첨부 추가<input type="file" id="attachInput" hidden></label>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px" th:if="${!#lists.isEmpty(attachments)}">
                    <div class="file" th:each="a : ${attachments}">
                        <span class="icn">📎</span>
                        <div class="name"><b th:text="${a.originalName}">파일</b></div>
                        <div class="actions">
                            <a class="btn sm" th:href="@{/api/projects/{p}/defects/{d}/attachments/{a}/download(p=${projId},d=${defect.id},a=${a.id})}"
                               th:attr="download=${a.originalName}">다운로드</a>
                        </div>
                    </div>
                </div>
                <p class="page-sub" style="margin:0" th:if="${#lists.isEmpty(attachments)}">첨부가 없습니다.</p>
                <div class="err" id="attachErr" style="display:none;color:var(--hot);margin-top:8px"></div>
            </section>

            <section class="card" style="margin-bottom:14px" th:if="${!#lists.isEmpty(linkedTestCases)}">
                <div class="card-head"><h3 th:text="'연결 TC (' + ${#lists.size(linkedTestCases)} + ')'">연결 TC</h3></div>
                <div class="card-list">
                    <div class="item" th:each="t : ${linkedTestCases}">
                        <a class="body" th:href="@{/projects/{id}/test-cases/{tc}(id=${projId},tc=${t.id})}"
                           style="text-decoration:none;color:inherit;flex:1;min-width:0">
                            <b th:text="${t.code}">TC-001</b> <span th:text="${t.title}">제목</span>
                        </a>
                        <span th:switch="${t.status}">
                            <span th:case="'passed'" class="pill ok">통과</span>
                            <span th:case="'failed'" class="pill hot">실패</span>
                            <span th:case="*" class="pill muted">대기</span>
                        </span>
                        <button class="icon-action danger" type="button" th:if="${navTier == 'team'}"
                                th:attr="data-unlink-tc=${t.id}" title="연결 해제" aria-label="연결 해제">✕</button>
                    </div>
                </div>
                <p id="defLinkErr" class="err" style="display:none;color:var(--hot);margin-top:8px"></p>
            </section>

            <section class="action-bar" th:if="${navTier == 'team'}">
                <span class="label">상태 변경</span>
                <button class="btn" type="button" data-defect-status="open">미해결</button>
                <button class="btn" type="button" data-defect-status="in_progress">진행 중</button>
                <button class="btn primary" type="button" data-defect-status="resolved">해결 완료</button>
                <button class="btn" type="button" data-defect-status="cannot_reproduce">재현 불가</button>
                <span class="err" id="defectDetailErr" style="display:none;color:var(--hot);margin-left:12px"></span>
            </section>

        </main>
    </div>
</div>
<script th:src="@{/js/qa-defect.js}" defer></script>
</body>
</html>
