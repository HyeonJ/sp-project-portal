<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('감사 로그 · SoftPuzzle PM')}"></head>
<body>
<div class="app">
    <div th:replace="~{fragments/shell :: adminSidebar('audit')}"></div>
    <div>
        <div th:replace="~{fragments/shell :: adminTopbar('감사 로그')}"></div>
        <main class="main" id="adminAudit">
            <div class="page-bar">
                <div><h1 class="page-title">감사 로그</h1></div>
            </div>

            <div class="filter-bar">
                <div class="filter">기간 ▾</div>
                <div class="filter">사용자 ▾</div>
                <div class="filter">액션 ▾</div>
                <div class="filter search-input"><span style="color:var(--muted)">⌕</span><input type="text" placeholder="대상 객체 검색"></div>
            </div>

            <section class="card flat" style="padding:0;overflow:hidden">
                <table class="tbl">
                    <thead><tr><th>일시</th><th>사용자</th><th>역할</th><th>액션</th><th>대상</th></tr></thead>
                    <tbody id="adminAuditBody"><tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px">불러오는 중…</td></tr></tbody>
                </table>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
