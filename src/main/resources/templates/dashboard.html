<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('프로젝트 · SoftPuzzle PM')}"></head>
<body>
<div class="app">
    <div th:replace="~{fragments/shell :: globalSidebar('projects')}"></div>
    <div>
        <div th:replace="~{fragments/shell :: topbar('프로젝트 목록')}"></div>
        <main class="main">
            <h1 class="page-title">프로젝트 목록</h1>

            <div class="filter-bar">
                <div class="filter">상태 ▾</div>
                <div class="filter">고객사 ▾</div>
                <div class="filter">정렬: 최근 ▾</div>
                <div class="filter search-input"><span style="color:var(--muted)">⌕</span><input type="text" placeholder="프로젝트명·고객사 검색"></div>
                <a class="btn primary sm" th:if="${navCanCreate}" th:href="@{/projects/new}" style="margin-left:auto">+ 새 프로젝트</a>
            </div>

            <div id="projectList" class="grid cols-2">
                <p class="page-sub">불러오는 중…</p>
            </div>
        </main>
    </div>
</div>
</body>
</html>
