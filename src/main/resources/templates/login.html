<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('로그인 · SoftPuzzle PM')}"></head>
<body>
<div class="auth-page">
    <div class="logo">SoftPuzzle PM</div>
    <form class="auth-card" method="post" th:action="@{/login}">
        <h1>로그인</h1>
        <p class="sub">계정으로 로그인하세요</p>
        <label class="label">이메일</label>
        <input type="email" name="username" autocomplete="username" required autofocus placeholder="user@example.com">
        <label class="label">비밀번호</label>
        <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
        <div th:if="${param.error}" class="err">이메일 또는 비밀번호가 올바르지 않습니다.</div>
        <div th:if="${param.logout}" class="err" style="color:var(--ok)">로그아웃되었습니다.</div>
        <div th:if="${param.accepted}" class="err" style="color:var(--ok)">계정이 활성화되었습니다. 로그인하세요.</div>
        <div th:if="${param.reset}" class="err" style="color:var(--ok)">비밀번호가 변경되었습니다.</div>
        <button type="submit" class="btn primary btn-full" style="margin-top:8px">로그인</button>
        <div class="footer"><a th:href="@{/password/reset}">비밀번호 재설정</a></div>
    </form>
    <p style="color:var(--muted-2);font-size:11px;margin-top:24px;text-align:center">5회 실패 시 잠금</p>
</div>
</body>
</html>
