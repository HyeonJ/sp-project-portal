<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('초대 수락 · SoftPuzzle PM')}"></head>
<body>
<div class="auth-page">
    <div class="logo">SoftPuzzle PM</div>
    <form class="auth-card" id="inviteAcceptForm">
        <h1>초대 수락</h1>
        <p class="sub">비밀번호를 설정하면 프로젝트에 참여합니다.</p>
        <label class="label">비밀번호</label>
        <input type="password" name="password" autocomplete="new-password" required placeholder="8자 이상·영문+숫자">
        <div id="acceptErr" class="err" style="display:none"></div>
        <button type="submit" class="btn primary btn-full" style="margin-top:8px">참여하기</button>
    </form>
</div>
<script th:src="@{/js/auth-flow.js}" defer></script>
</body>
</html>
