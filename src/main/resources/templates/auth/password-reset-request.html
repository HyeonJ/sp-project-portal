<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('비밀번호 재설정 · SoftPuzzle PM')}"></head>
<body>
<div class="auth-page">
    <div class="logo">SoftPuzzle PM</div>
    <form class="auth-card" id="resetRequestForm">
        <h1>비밀번호 재설정</h1>
        <p class="sub">가입한 이메일을 입력하세요.</p>
        <label class="label">이메일</label>
        <input type="email" name="email" autocomplete="email" required placeholder="user@example.com">
        <div id="reqMsg" class="err" style="display:none"></div>
        <button type="submit" class="btn primary btn-full" style="margin-top:8px">재설정 링크 받기</button>
        <div class="footer"><a th:href="@{/login}">로그인으로</a></div>
    </form>
</div>
<script th:src="@{/js/auth-flow.js}" defer></script>
</body>
</html>
