<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('비밀번호 재설정 · SoftPuzzle PM')}"></head>
<body>
<div class="auth-page">
    <div class="logo">SoftPuzzle PM</div>
    <form class="auth-card" id="resetConfirmForm">
        <h1>새 비밀번호 설정</h1>
        <p class="sub">새 비밀번호를 입력하세요.</p>
        <label class="label">새 비밀번호</label>
        <input type="password" name="password" autocomplete="new-password" required placeholder="8자 이상·영문+숫자">
        <div id="confirmErr" class="err" style="display:none"></div>
        <button type="submit" class="btn primary btn-full" style="margin-top:8px">변경</button>
    </form>
</div>
<script th:src="@{/js/auth-flow.js}" defer></script>
</body>
</html>
