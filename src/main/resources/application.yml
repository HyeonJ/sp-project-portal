spring:
  application:
    name: sp-project-portal
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never   # 세션 스키마는 Flyway가 소유 (자동 init off)
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  servlet:
    session:
      timeout: 30m   # REQ-AUT-009 무활동 30분 만료

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.softpuzzle.pm
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.softpuzzle.pm: DEBUG

# 파일 스토리지 (dev=로컬, prod=S3)
storage:
  type: local
  local-dir: ${STORAGE_LOCAL_DIR:./.storage}
