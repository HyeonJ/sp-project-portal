# prod: 모든 시크릿/접속정보는 환경변수 필수. 미설정 시 기동 실패(fail-fast).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  thymeleaf:
    cache: true

# 파일 스토리지: 영속 볼륨 디렉토리. (S3 어댑터는 향후 FileStorage 구현 추가 시 type=s3로 전환)
storage:
  type: local
  local-dir: ${STORAGE_LOCAL_DIR:/data/storage}

logging:
  level:
    com.softpuzzle.pm: INFO
